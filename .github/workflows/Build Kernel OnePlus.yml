name: Build All OnePlus Kernels
on:
  workflow_dispatch:
    inputs:
      FILE:
        type: choice
        description: "配置文件"
        required: true
        default: oneplus_ace_6
        options:
          - oneplus_nord_n30_se_5g_v
          - oneplus_10r_v
          - oneplus_nord_3_v
          - oneplus_ace_v
          - oneplus_ace_race_v
          - oneplus_10_pro_b
          - oneplus_10t_v
          - oneplus_11r_b
          - oneplus_ace2_b
          - oneplus_pad_lite_b
          - oneplus_pad_lite_Canary_b
          - oneplus_pad_mt6983_b
          - oneplus_ace_2v_b
          - oneplus_ace_pro_v
          - oneplus_11_b
          - oneplus_12r_b
          - oneplus_ace2_pro_b
          - oneplus_ace3_b
          - oneplus_open_b
          - oneplus_nord_ce4_b
          - oneplus_12_b
          - oneplus_pad_go_2_b
          - oneplus_nord_ce4_lite_5g_b
          - oneplus_nord_ce6_lite_b
          - oneplus_turbo_6v
          - oneplus_nord_4_b
          - oneplus_ace_3v_b
          - oneplus_pad_mt6897_b
          - oneplus_13r_b
          - oneplus_ace3_pro_b
          - oneplus_ace5_b
          - oneplus_pad_pro_b
          - oneplus_pad2_b
          - oneplus_nord_ce5_b
          - oneplus_nord_5_b
          - oneplus_ace5_pro_b
          - oneplus_13_b
          - oneplus_13t_b
          - oneplus_13s_b
          - oneplus_pad_2_pro_b
          - oneplus_pad_3_b
          - oneplus_ace5_race_b
          - oneplus_ace5_ultra_b
          - oneplus_pad2_mt6991_b
          - oneplus_ace_6
          - oneplus_turbo_6
          - oneplus_nord_6
          - oneplus_ace_6t
          - oneplus_ace_6t_Canary
          - oneplus_15r
          - oneplus_15r_Canary
          - oneplus_15
          - oneplus_15_Canary
          - oneplus_15t
          - oneplus_15t_Canary
          - oneplus_pad_3_pro
          - oneplus_pad_3_pro_Canary
          - oneplus_pad_4
          - oneplus_pad_4_Canary
          - oneplus_ace6_ultra
          - oneplus_ace6_ultra_Canary
      MANAGER_SOURCE:
        type: choice
        description: "管理器调用方向"
        required: true
        default: MIUIX
        options:
          - MIUIX
          - MIUIX_SPOOF
          - MD3
          - MD3_SPOOF
      SUSFS_CI:
        type: choice
        description: "SUSFS模块下载调用方向"
        required: true
        default: N/A
        options:
          - CI
          - Release
          - N/A
      KPM:
        type: choice
        description: "内核模块实现方式"
        required: true
        default: KPM
        options:
          - KPM
          - KPN
          - N/A
      SUSFS_META:
        type: string
        description: "回退SUSFS(输入哈希或次数或-1关闭)"
        required: false
        default: ""
      DYNAMIC_REPO:
        type: string
        description: "动态清单仓库所有者"
        required: true
        default: "Numbersf"
      BUILD_TIME:
        type: string
        description: "自定义构建时间(输入F使用UTCT或-1关闭)"
        required: false
        default: "Fri Dec 12 11:37:03 UTC 2025"
      KSU_META:
        type: string
        description: "分支名(必填)/自定义版本标识(留空不修改)/回退分支提交哈希版本(留空不修改)"
        required: false
        default: "builtin/Numbersf/"
      LZ4_UPDATE:
        type: boolean
        description: "是否升级LZ4到上游最新？"
        required: true
        default: false
      ZRAM:
        type: string
        description: "ZRAM(0关闭1开启)/算法名/大小"
        required: true
        default: "0/lz4kd/8589934592"
      SUFFIX:
        type: string
        description: "自定义内核后缀(不输入使用RAND_STR或-1关闭)"
        required: false
        default: ""
      SUBLEVEL:
        description: "自定义内核等级欺骗(SUBLEVEL)"
        required: false
        default: ""
      FAST_BUILD:
        type: boolean
        description: "是否启用极速构建？"
        required: true
        default: true
      LSM_BBG:
        type: boolean
        description: "是否启用关键分区写入保护模块(BBG)？"
        required: true
        default: true
      NETFILTER:
        type: boolean
        description: "是否启用网络功能拓展(NETFILTER)？"
        required: true
        default: true
      CCM:
        type: boolean
        description: "是否启用网络拥塞控制与管理机制(BBR+ECN)？"
        required: true
        default: true
      UNICODE_BYPASS:
        type: boolean
        description: "是否添加Unicode不可见字码点绕过读取漏洞修复？"
        required: true
        default: true
      SCHED_HMBIRD:
        type: boolean
        description: "是否添加风驰驱动1.0？"
        required: true
        default: true
      DROID_SPACES:
        type: boolean
        description: "是否添加轻量级Linux容器支持(DroidSpaces)？"
        required: true
        default: false
      RE_KERNEL:
        type: boolean
        description: "是否添加Re-Kernel？"
        required: true
        default: false
      SUSFS_DEV:
        type: boolean
        description: "是否拉取SUSFS-DEV分支？"
        required: true
        default: false
      SPACE_NOCLEAN:
        type: boolean
        description: "是否停用空间清扫？"
        required: true
        default: false
      BUILD_NOCACHE:
        type: boolean
        description: "是否停用此次缓存？"
        required: true
        default: false
jobs:
  build:
    name: ${{ github.event.inputs.FAST_BUILD == 'true' && ' [FAST]' || '' }}${{ contains(github.event.inputs.FILE, '_aosp') && ' [AOSP]' || '' }}${{ github.event.inputs.KPM == 'KPM' && ' [KPM]' || github.event.inputs.KPM == 'KPN' && ' [KPN]' || '' }}${{ github.event.inputs.LSM_BBG == 'true' && ' [BBG]' || '' }}${{ github.event.inputs.SCHED_HMBIRD == 'true' && ' [HMBIRD]' || '' }}${{ github.event.inputs.DROID_SPACES == 'true' && ' [DS]' || '' }}${{ startsWith(github.event.inputs.ZRAM, '1/') && ' [ZRAM]' || '' }}${{ github.event.inputs.RE_KERNEL == 'true' && ' [REKER]' || '' }}${{ github.event.inputs.LZ4_UPDATE == 'true' && ' [LZ4UPD]' || '' }}For ${{ github.event.inputs.FILE }} ${{ github.event.inputs.SUFFIX }}
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "none"
      CCACHE_NOHASHDIR: "true"
      CCACHE_NOHARDLINK: "true"
      CCACHE_IS_KERNEL_COMPILING: "true"
      CCACHE_MAXSIZE: 5G
      VM_BRIDGE_BUILD: ${{ github.event.inputs.FILE == 'oneplus_ace_6' }}
      VM_BRIDGE_REPOSITORY: "1jsuwgsjw/DeltaKernel-Android-KO-Build"
      VM_BRIDGE_REF: "b4cfec54c1d2f2e35f892d9e57dac6120bd4b8c5"
      VM_BRIDGE_TARGET_RELEASE: "6.6.89-android15-7-o-g880af585653a9e"
      VM_BRIDGE_TARGET_CLANG: "r510928"
      VM_BRIDGE_TARGET_CONFIG_SHA256: "7d0be339c9e16f4f8880700cac24e90ff24ce40044077656d97c8b4aa7152e3c"
      VM_BRIDGE_REFERENCE_IMAGE_SHA256: "7af010b8e92be131b075d3c9331c156c4caa21c35a7b3c0472f384719d1d129b"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Maximize Build Space
        if: ${{ github.event.inputs.SPACE_NOCLEAN == 'false' }}
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Extract Manifest Info
        id: extract_info
        env:
          FILE: ${{ github.event.inputs.FILE }}
          BUILD_VM_BRIDGE: ${{ env.VM_BRIDGE_BUILD }}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          if [[ "$FILE" =~ ^(.+)_([a-zA-Z])$ ]]; then
            FILE_CONF="${BASH_REMATCH[1]}"
          else
            FILE_CONF="$FILE"
          fi
          FILE_BASE=$(echo "$FILE_CONF" | sed -E 's/_bak//g; /_aosp/{s/_aosp//g;s/$/(AOSP)/;}; s/_([a-zA-Z0-9])/\U\1/g; s/^oneplus/OnePlus/; s/^realme/RealME/; s/^oppo/OPPO/')
          mkdir -p ".repo/manifests_fallback"
          XML_PATH=".repo/manifests_fallback/${FILE}.xml"
          README_PATH=".repo/manifests_fallback/README.md"
          echo "处理 FILE=$FILE, CONF=$FILE_CONF, BASE=$FILE_BASE"
          echo "FILE_CONF=$FILE_CONF" >> $GITHUB_ENV
          echo "FILE_BASE=$FILE_BASE" >> $GITHUB_ENV

          # 动态调用源码清单仓库，仓库优先级：1️⃣ OnePlusOSS → 2️⃣ Dynamic → 3️⃣ Appendix
          DYNAMIC_REPO_INPUT="${{ github.event.inputs.DYNAMIC_REPO }}"
          declare -A REPOS
          REPOS["OnePlusOSS"]="OnePlusOSS|kernel_manifest"
          REPOS["Dynamic"]="${DYNAMIC_REPO_INPUT}|kernel_manifest"
          REPOS["Appendix"]="Numbersf|Kernel_Manifest_Appendix"

          FOUND_REPO=""
          FOUND_BRANCH=""

          check_repo() {
            local ENTRY=$1
            local OWNER=${ENTRY%%|*}
            local REPO_NAME=${ENTRY##*|}

            echo "🌐 尝试拉取 ${OWNER}/${REPO_NAME} 分支列表..."
            BRANCHES=$(git ls-remote --heads https://github.com/${OWNER}/${REPO_NAME}.git | sed 's|.*refs/heads/||')

            if [[ -z "$BRANCHES" ]]; then
              echo "⚠️ ${OWNER}/${REPO_NAME} 分支列表获取失败，请尝试重新运行工作流。"
              return 1
            fi
            for BRANCH in $BRANCHES; do
              XML_URL="https://raw.githubusercontent.com/${OWNER}/${REPO_NAME}/${BRANCH}/${FILE}.xml"
              README_URL="https://raw.githubusercontent.com/${OWNER}/${REPO_NAME}/${BRANCH}/README.md"

              if curl -sf --head "$XML_URL" >/dev/null; then
                echo "✅ 在 ${OWNER}/${REPO_NAME} 找到 ${FILE}.xml (分支: ${BRANCH})"
                curl -s -o "$XML_PATH" "$XML_URL"
                curl -s -o "$README_PATH" "$README_URL" || true

                FOUND_REPO="$OWNER"
                FOUND_REPO_NAME="$REPO_NAME"
                FOUND_BRANCH="$BRANCH"

                return 0
              fi
            done
            return 1
          }
          if [[ "$BUILD_VM_BRIDGE" == "true" && "$FILE" == "oneplus_ace_6" ]]; then
            FOUND_REPO="OnePlusOSS"
            FOUND_REPO_NAME="kernel_manifest"
            FOUND_BRANCH="oneplus/sm8750"
            PINNED_BASE="https://raw.githubusercontent.com/${FOUND_REPO}/${FOUND_REPO_NAME}/${FOUND_BRANCH}"
            curl -fsS -o "$XML_PATH" "$PINNED_BASE/${FILE}.xml"
            curl -fsS -o "$README_PATH" "$PINNED_BASE/README.md"
            grep -q 'revision="oneplus/sm8750_b_16.0.0_ace_6"' "$XML_PATH"
            echo "✅ vm_bridge 使用固定清单 ${FOUND_REPO}/${FOUND_REPO_NAME}:${FOUND_BRANCH}/${FILE}.xml"
          elif ! check_repo "${REPOS["OnePlusOSS"]}"; then
            if ! check_repo "${REPOS["Dynamic"]}"; then
              check_repo "${REPOS["Appendix"]}"
            fi
          fi
          if [[ -z "$FOUND_REPO" || ! -s "$XML_PATH" ]]; then
            echo "❌ 无法在任何仓库中找到 ${FILE}.xml"
            exit 8
          fi
          echo "MANIFEST_REPO=$FOUND_REPO" >> "$GITHUB_ENV"
          echo "MANIFEST_REPO_NAME=$FOUND_REPO_NAME" >> "$GITHUB_ENV"
          echo "MANIFEST_BRANCH=$FOUND_BRANCH" >> "$GITHUB_ENV"

          # 解析 revision 字符串
          REVISION=$(grep -oP '<project[^>]+revision="\K[^"]+' "$XML_PATH" | head -n1 || true)
          echo "解析 FILE 获取 CPU 和 ANDROID_VERSION..."
          # 提取 CPU
          CPU=$(echo "$REVISION" | sed -E 's#^(oneplus|realme|oppo)/([^_]+).*#\2#')
          # 提取 ANDROID_VERSION
          ANDROID_VERSION=$(echo "$REVISION" | grep -oP '\d{1,2}\.\d{1,2}(\.\d{1,2})?')
          if [[ -n "$CPU" && -n "$ANDROID_VERSION" ]]; then
            echo "✅ CPU=$CPU, ANDROID_VERSION=$ANDROID_VERSION"
            echo "CPU=$CPU" >> $GITHUB_ENV
            echo "ANDROID_VERSION=$ANDROID_VERSION" >> $GITHUB_ENV
            # 获取短位 Android 版本号
            echo "ANDROID_SHORT_VERSION=${ANDROID_VERSION%%.*}" >> $GITHUB_ENV
          else
            echo "❌ 无法从 revision 中提取 CPU 或 ANDROID_VERSION"
            exit 1
          fi

          echo "解析 README.md 获取 CPUD 和 BUILD_METHOD..."
          if [[ -s "$README_PATH" ]]; then
            BUILD_LINE=$(grep -m1 'oplus_build_kernel.sh' "$README_PATH" || true)
            if [[ -n "$BUILD_LINE" ]]; then
              CPUD=$(echo "$BUILD_LINE" | awk '{print $(NF-1)}')
              BUILD_METHOD=$(echo "$BUILD_LINE" | awk '{print $NF}')
              echo "✅ CPUD=$CPUD, BUILD_METHOD=$BUILD_METHOD"
              echo "CPUD=$CPUD" >> $GITHUB_ENV
              echo "BUILD_METHOD=$BUILD_METHOD" >> $GITHUB_ENV
            else
              echo "❌ README.md 中未找到构建命令"
            fi
          else
            echo "❌ README.md 下载失败或为空"
          fi

          # 传递组合信息
          echo "value=${FILE_BASE}_Android${ANDROID_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Debug Show Selected Inputs
        run: |
          echo "------------------------------"

          echo "Selected CPU: ${{ env.CPU }}"
          echo "Selected CPUD: ${{ env.CPUD }}"
          echo "Selected ANDROID_VERSION: ${{ env.ANDROID_VERSION }}"
          echo "Selected BUILD_METHOD: ${{ env.BUILD_METHOD }}"
          echo "Selected FILE: ${{ github.event.inputs.FILE }}"
          echo "Selected MANAGER_SOURCE: ${{ github.event.inputs.MANAGER_SOURCE }}"
          echo "Selected SUSFS_CI: ${{ github.event.inputs.SUSFS_CI }}"
          if [ "${{ github.event.inputs.SUSFS_CI }}" != "N/A" ]; then
            echo "::warning title=SUSFS Not Required::当前管理器已自带附加模块，无需启用 SUSFS 模块，强制启用可能导致不开机。"
          fi
          echo "Selected KPM: ${{ github.event.inputs.KPM }}"
          echo "Custom SUSFS_META: ${{ github.event.inputs.SUSFS_META }}"
          echo "Custom KSU_META: ${{ github.event.inputs.KSU_META }}"
          echo "Selected ZRAM: ${{ github.event.inputs.ZRAM }}"
          echo "Selected LSM_BBG: ${{ github.event.inputs.LSM_BBG }}"
          echo "Selected NETFILTER: ${{ github.event.inputs.NETFILTER }}"
          echo "Selected CCM: ${{ github.event.inputs.CCM }}"
          echo "Selected SUSFS_DEV: ${{ github.event.inputs.SUSFS_DEV }}"
          echo "Selected FAST_BUILD: ${{ github.event.inputs.FAST_BUILD }}"
          echo "Selected SCHED_HMBIRD: ${{ github.event.inputs.SCHED_HMBIRD }}"
          echo "Selected UNICODE_BYPASS: ${{ github.event.inputs.UNICODE_BYPASS }}"
          echo "Selected DROID_SPACES: ${{ github.event.inputs.DROID_SPACES }}"
          echo "Selected RE_KERNEL: ${{ github.event.inputs.RE_KERNEL }}"
          echo "Selected LZ4_UPDATE: ${{ github.event.inputs.LZ4_UPDATE }}"
          echo "Selected VM_BRIDGE_BUILD: $VM_BRIDGE_BUILD"
          echo "Selected VM_BRIDGE_REPOSITORY: $VM_BRIDGE_REPOSITORY"
          echo "Selected VM_BRIDGE_REF: $VM_BRIDGE_REF"
          echo "Selected VM_BRIDGE_TARGET_RELEASE: $VM_BRIDGE_TARGET_RELEASE"
          echo "Selected VM_BRIDGE_TARGET_CLANG: $VM_BRIDGE_TARGET_CLANG"
          echo "Selected VM_BRIDGE_TARGET_CONFIG_SHA256: $VM_BRIDGE_TARGET_CONFIG_SHA256"
          echo "Selected VM_BRIDGE_REFERENCE_IMAGE_SHA256: $VM_BRIDGE_REFERENCE_IMAGE_SHA256"

          BUILD_TIME="${{ github.event.inputs.BUILD_TIME }}"
          SUFFIX="${{ github.event.inputs.SUFFIX }}"

          # BUILD_TIME
          echo "Custom BUILD_TIME: $BUILD_TIME"
          echo -n "BUILD_TIME Unicode: "
          python3 - <<EOF
          import unicodedata, re
          s = """$BUILD_TIME"""
          warn = False
          out = []
          space_count = 0
          for c in s:
              if c == ' ':
                  space_count += 1
                  # 前两个空格允许，之后标红
                  if space_count <= 2:
                      out.append(f'U+{ord(c):04X} ')
                  else:
                      warn = True
                      out.append(f'\033[31mU+{ord(c):04X}\033[0m ')
                  continue
              else:
                  space_count = 0
              if unicodedata.category(c) == 'Cf' or (c.isspace() and c != ' '):
                  warn = True
                  out.append(f'\033[31mU+{ord(c):04X}\033[0m ')
              else:
                  out.append(f'U+{ord(c):04X} ')
          print(''.join(out))
          # 异常字符警告
          if warn:
              print("::warning title=BUILD_TIME Error::检测到自定义构建时间异常符号调用，请注意!")
          EOF

          # SUFFIX
          echo "Custom SUFFIX: $SUFFIX"
          echo -n "SUFFIX Unicode: "
          python3 - <<EOF
          import unicodedata, re
          s = """$SUFFIX"""
          warn = False
          out = []
          for c in s:
              if c.isspace() or unicodedata.category(c) == 'Cf':
                  warn = True
                  out.append(f'\033[31mU+{ord(c):04X}\033[0m ')
              else:
                  out.append(f'U+{ord(c):04X} ')
          print(''.join(out))

          # 异常字符警告
          if warn:
              print("::warning title=SUFFIX Error::检测到自定义内核后缀异常符号调用，请注意!")
          # 格式重复检测
          if re.search(r'^\d{1,3}\.\d{1,3}\.\d{1,3}|-?android\d{2,3}-', s):
              print("::warning title=SUFFIX Format Error::检测到自定义内核后缀存在重复或冗余内容调用，请注意!")
          EOF

          echo "------------------------------"

      - name: Validate vm_bridge exact kernel baseline
        if: ${{ env.VM_BRIDGE_BUILD == 'true' }}
        shell: bash
        env:
          FILE: ${{ github.event.inputs.FILE }}
          MANAGER_SOURCE: ${{ github.event.inputs.MANAGER_SOURCE }}
          SUSFS_CI: ${{ github.event.inputs.SUSFS_CI }}
          KPM: ${{ github.event.inputs.KPM }}
          SUSFS_META: ${{ github.event.inputs.SUSFS_META }}
          KSU_META: ${{ github.event.inputs.KSU_META }}
          ZRAM: ${{ github.event.inputs.ZRAM }}
          LSM_BBG: ${{ github.event.inputs.LSM_BBG }}
          NETFILTER: ${{ github.event.inputs.NETFILTER }}
          CCM: ${{ github.event.inputs.CCM }}
          SUSFS_DEV: ${{ github.event.inputs.SUSFS_DEV }}
          FAST_BUILD: ${{ github.event.inputs.FAST_BUILD }}
          SCHED_HMBIRD: ${{ github.event.inputs.SCHED_HMBIRD }}
          UNICODE_BYPASS: ${{ github.event.inputs.UNICODE_BYPASS }}
          DROID_SPACES: ${{ github.event.inputs.DROID_SPACES }}
          RE_KERNEL: ${{ github.event.inputs.RE_KERNEL }}
          LZ4_UPDATE: ${{ github.event.inputs.LZ4_UPDATE }}
          BUILD_TIME: ${{ github.event.inputs.BUILD_TIME }}
          SUBLEVEL: ${{ github.event.inputs.SUBLEVEL }}
        run: |
          # CTF|认证
          set -euo pipefail
          require_eq() {
            local name="$1"
            local actual="$2"
            local expected="$3"
            if [[ "$actual" != "$expected" ]]; then
              echo "vm_bridge 完整内核基线不匹配: $name=$actual expected=$expected" >&2
              exit 1
            fi
          }

          require_eq FILE "$FILE" oneplus_ace_6
          require_eq CPU "${CPU:-}" sm8750
          require_eq CPUD "${CPUD:-}" sun
          require_eq BUILD_METHOD "${BUILD_METHOD:-}" perf
          require_eq MANAGER_SOURCE "$MANAGER_SOURCE" MIUIX
          require_eq SUSFS_CI "$SUSFS_CI" N/A
          require_eq KPM "$KPM" KPM
          require_eq SUSFS_META "$SUSFS_META" ""
          require_eq KSU_META "$KSU_META" builtin/Numbersf/
          require_eq ZRAM "$ZRAM" 0/lz4kd/8589934592
          require_eq LSM_BBG "$LSM_BBG" true
          require_eq NETFILTER "$NETFILTER" true
          require_eq CCM "$CCM" true
          require_eq SUSFS_DEV "$SUSFS_DEV" false
          require_eq FAST_BUILD "$FAST_BUILD" true
          require_eq SCHED_HMBIRD "$SCHED_HMBIRD" true
          require_eq UNICODE_BYPASS "$UNICODE_BYPASS" true
          require_eq DROID_SPACES "$DROID_SPACES" false
          require_eq RE_KERNEL "$RE_KERNEL" false
          require_eq LZ4_UPDATE "$LZ4_UPDATE" false
          require_eq BUILD_TIME "$BUILD_TIME" "Fri Dec 12 11:37:03 UTC 2025"
          require_eq SUBLEVEL "$SUBLEVEL" ""
          echo "vm_bridge exact kernel baseline validated"

      - name: Checkout vm_bridge_01 source
        if: ${{ env.VM_BRIDGE_BUILD == 'true' }}
        uses: actions/checkout@v6
        with:
          repository: ${{ env.VM_BRIDGE_REPOSITORY }}
          ref: ${{ env.VM_BRIDGE_REF }}
          path: vm_bridge_source
          fetch-depth: 0

      - name: Check Disk Space
        run: df -h

      - name: Create and Enable 3G Swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 3G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Set Cache Environment
        if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' }}
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_${{ github.event.inputs.FILE }}" >> $GITHUB_ENV
          mkdir -p "$HOME/.ccache_${{ github.event.inputs.FILE }}"
          echo "set: $HOME/.ccache_${{ github.event.inputs.FILE }}"

      - name: Configure Git
        run: |
          git config --global user.name "Numbersf"
          git config --global user.email "263623064@qq.com"
          mkdir kernel_workspace && cd kernel_workspace
          git clone https://github.com/Numbersf/Action-Build.git -b SukiSU-Ultra
          if [[ "${{ env.VM_BRIDGE_BUILD }}" == "true" ]]; then
            git -C Action-Build checkout --detach 0f53922ab1ff678d0898c0f7a8655a29f3649cd8
            test "$(git -C Action-Build rev-parse HEAD)" = "0f53922ab1ff678d0898c0f7a8655a29f3649cd8"
            # 第二次 actions/checkout 后原始工作区路径不稳定，因此在 kernel_workspace
            # 内按当前 workflow SHA 单独检出固定 SUSFS 快照。
            SUSFS_SNAPSHOT_CHECKOUT="$GITHUB_WORKSPACE/kernel_workspace/susfs-snapshot-source"
            git clone --depth=1 --branch "$GITHUB_REF_NAME" \
              "https://github.com/${GITHUB_REPOSITORY}.git" "$SUSFS_SNAPSHOT_CHECKOUT"
            git -C "$SUSFS_SNAPSHOT_CHECKOUT" fetch --depth=1 origin "$GITHUB_SHA"
            git -C "$SUSFS_SNAPSHOT_CHECKOUT" checkout --detach "$GITHUB_SHA"
            test "$(git -C "$SUSFS_SNAPSHOT_CHECKOUT" rev-parse HEAD)" = "$GITHUB_SHA"
            test -f "$SUSFS_SNAPSHOT_CHECKOUT/kernel_patches/SOURCE_COMMIT"
            cp -a "$SUSFS_SNAPSHOT_CHECKOUT/kernel_patches" Action-Build/
            for extra in ksu_susfs ksu_module_susfs build_ksu_susfs_tool.sh build_ksu_module.sh; do
              [ ! -e "$SUSFS_SNAPSHOT_CHECKOUT/$extra" ] || cp -a "$SUSFS_SNAPSHOT_CHECKOUT/$extra" Action-Build/
            done
          fi

      - name: Fork Check
        run: |
          repo="${{ github.repository }}"; json=$(curl -s "https://api.github.com/repos/$repo")
          parent=$(echo "$json" | grep -o '"full_name": *"[^"]*"' | head -n 2 | tail -n 1 | sed 's/.*"full_name": *"\([^"]*\)".*/\1/')
          if [ -n "$parent" ] && [ "$parent" != "Numbersf/Action-Build" ]; then
            echo "::warning title=Source Warning::您使用的内核编译地址为非官方源，可能导致运行失败或内核异常。"
          fi

      - name: Reject Check
        run: |
          cat > /tmp/check_rejects.sh << 'EOF'
          check_rejects() {
            local SEARCH_DIR="${1:-.}"
            REJECT_FILES=$(find "$SEARCH_DIR" -name "*.rej" 2>/dev/null)
            if [ -z "$REJECT_FILES" ]; then
              return 0
            fi
            while IFS= read -r REJ_FILE; do
              ORIG_FILE="${REJ_FILE%.rej}"
              ORIG_FILE="${ORIG_FILE#./}"
              echo "::group::❌ 补丁在 ${ORIG_FILE} 出现 hunk FAILED，点击查看具体信息"
              cat "$REJ_FILE"
              echo "::endgroup::"
            done <<< "$REJECT_FILES"
          }
          EOF
          chmod +x /tmp/check_rejects.sh
          echo "REJ_CHECKER=/tmp/check_rejects.sh" >> $GITHUB_ENV

      - name: Restore APT Cache
        id: apt-cache
        uses: actions/cache@v5
        with:
          path: ~/apt-cache-debs
          key: apt-cache-${{ runner.os }}-${{ github.ref_name }}-v3

      - name: Install Dependencies
        run: |
          mkdir -p ~/apt-cache-debs
          if [ "${{ steps.apt-cache.outputs.cache-hit }}" != "true" ]; then
            sudo apt-get update
          else
            echo "✅ APT 缓存命中，跳过 apt-get update"
          fi
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-cache-debs" python3 git curl libelf-dev build-essential flex bison libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils rsync unzip zip gawk dos2unix kmod libdw-dev elfutils dwarves
          sudo rm -f ~/apt-cache-debs/lock
          sudo rm -rf ~/apt-cache-debs/partial

      - name: Install Ccache-ECS
        run: |
         LIB_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/lib"
         sudo cp -f "$LIB_DIR/ccache" /usr/bin/ccache && sudo chmod +x /usr/bin/ccache

      - name: Restore Ccache
        if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' }}
        id: restore-ccache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.event.inputs.FILE }}-${{ env.BUILD_METHOD }}-${{ github.event.inputs.FAST_BUILD == 'true' && 'alpha' || 'beta' }}-16.8

      - name: Restore ThinLTO Cache
        if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' && github.event.inputs.FAST_BUILD == 'true' }}
        id: restore-thinlto
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/kernel_workspace/.thinlto-cache
          key: thinlto-${{ runner.os }}-${{ github.ref_name }}-${{ github.event.inputs.FILE }}-16.8

      - name: Initialize Ccache
        if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' }}
        run: |
          INIT_FLAG="${{ env.CCACHE_DIR }}/.ccache_initialized"
          if command -v ccache >/dev/null 2>&1; then
            if [ ! -f "$INIT_FLAG" ]; then
              echo "初始化 ccache (${{ env.CCACHE_DIR }})..."
              mkdir -p "${{ env.CCACHE_DIR }}"
              ccache -M ${{ env.CCACHE_MAXSIZE }}
              touch "$INIT_FLAG"
              echo "✅ ccache 初始化完成"
            else
              echo "✅ ccache 已初始化，跳过"
            fi
          else
            echo "❌ 未安装 ccache，跳过"
          fi
          ccache -s

      - name: Install Repo Tool
        run: |
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo

      - name: Initialize Repo and Sync
        env:
          FILE: ${{ github.event.inputs.FILE }}
          BUILD_VM_BRIDGE: ${{ env.VM_BRIDGE_BUILD }}
        run: |
          cd kernel_workspace
          mkdir -p .repo/manifests
          cp "$GITHUB_WORKSPACE/.repo/manifests_fallback/${FILE}.xml" ".repo/manifests/${FILE}.xml"
          BASE_URL="https://github.com/${MANIFEST_REPO}/${MANIFEST_REPO_NAME}.git"

          echo "使用$MANIFEST_REPO/$MANIFEST_REPO_NAME($MANIFEST_BRANCH)初始化仓库..."
          repo init -u "$BASE_URL" -b "$MANIFEST_BRANCH" -m "${FILE}.xml" --depth=1 --no-clone-bundle --no-tags
          if [[ "$BUILD_VM_BRIDGE" == "true" && "$FILE" == "oneplus_ace_6" ]]; then
            mkdir -p .repo/local_manifests
            cat > .repo/local_manifests/vm_bridge_exact_source.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <extend-project name="android_kernel_common_oneplus_sm8750" path="kernel_platform/common" revision="c1802dd6f3343e71c166a3c67c50554c81880b6e" />
            <extend-project name="android_kernel_oneplus_sm8750" path="kernel_platform/msm-kernel" revision="d6cab2da32e05612c52d719453439c4813291be9" />
            <extend-project name="android_kernel_modules_and_devicetree_oneplus_sm8750" path="." revision="294f299327d43749bebdaa5ca5e8f692639549e6" />
          </manifest>
          EOF
          fi
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags --force-sync

          if [[ "$BUILD_VM_BRIDGE" == "true" && "$FILE" == "oneplus_ace_6" ]]; then
            test "$(git -C kernel_platform/common rev-parse HEAD)" = "c1802dd6f3343e71c166a3c67c50554c81880b6e"
            test "$(git -C kernel_platform/msm-kernel rev-parse HEAD)" = "d6cab2da32e05612c52d719453439c4813291be9"
            test "$(git rev-parse HEAD)" = "294f299327d43749bebdaa5ca5e8f692639549e6"
            echo "✅ vm_bridge 完整内核三项 OnePlus 源码已锁定到原始构建提交"
          fi

          KERNEL_REPOS=""
          KERNEL_REPOS_PATH=$(find . -type f -name "build.config.msm.common" | head -n 1)
          if [[ -n "$KERNEL_REPOS_PATH" ]]; then
            KERNEL_REPOS=$(echo "${KERNEL_REPOS_PATH#./}" | cut -d/ -f2)
            echo "✅ 发现 build.config.msm.common: $KERNEL_REPOS_PATH"
            echo "✅ KERNEL_REPOS=$KERNEL_REPOS"
            echo "KERNEL_REPOS=$KERNEL_REPOS" >> "$GITHUB_ENV"
          else
            echo "❎ 未找到 build.config.msm.common，可能是天玑清单或纯 Kleaf 构建结构"
          fi

          # 移除 ABI 保护
          for dir in kernel_platform/common kernel_platform/$KERNEL_REPOS; do
            if [ -e "$dir/BUILD.bazel" ]; then
              sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' "$dir/BUILD.bazel"
            fi
            rm -f "$dir/android/abi_gki_protected_exports_"* 2>/dev/null || echo "No protected exports in $dir"
          done

          # 移除构建审查
          if grep -q 'check_defconfig' kernel_platform/common/build.config.gki; then
            sed -i 's/check_defconfig//' kernel_platform/common/build.config.gki
          fi
          if grep -q 'check_defconfig = None,' kernel_platform/build/kernel/kleaf/common_kernels.bzl; then
            sed -i 's/check_defconfig = None,/check_defconfig = "disabled",/' kernel_platform/build/kernel/kleaf/common_kernels.bzl
            sed -i 's/if check_defconfig == None:/if False:  # check_defconfig == None:/' kernel_platform/build/kernel/kleaf/common_kernels.bzl
          fi

      - name: Kernel Version Handling
        run: |
          cd kernel_workspace/kernel_platform
          # 获取内核 Android 版本号(KANDROID_VERSION)以及内核版本号(KERNEL_VERSION)
          for f in ./common/build.config.constants ./common/build.config.common; do
            if [ -f "$f" ]; then
              KMI=$(grep -m1 '^BRANCH=' "$f" | cut -d= -f2)
              [ -n "$KMI" ] && break
            fi
          done
          if [[ -z "$KMI" && -n "$KERNEL_REPOS" ]]; then
            KMI=$(grep -m1 '^android' "./$KERNEL_REPOS/android/ACK_SHA" | cut -d- -f1,2)
          fi
          if [ -n "$KMI" ]; then
            echo "KMI=$KMI" >> $GITHUB_ENV
            echo "KANDROID_VERSION=${KMI%-*}" >> $GITHUB_ENV
            echo "KERNEL_VERSION=${KMI#*-}" >> $GITHUB_ENV
          else
            echo "No KMI found in build.config* and ACK_SHA files"
          fi

          # 从 Makefile 获取完整内核版本号(TKERNEL_VERSION)以及可选的修改内核等级
          ORIG_VERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' ./common/Makefile)

          # 强制修改 SUBLEVEL(内核等级)
          SUBLEVEL_INPUT="${{ github.event.inputs.SUBLEVEL }}"
          if [ -n "$SUBLEVEL_INPUT" ]; then
            echo "修改 SUBLEVEL 为 $SUBLEVEL_INPUT"
            sed -i "s/^\(SUBLEVEL[[:space:]]*=[[:space:]]*\).*/\1$SUBLEVEL_INPUT/" ./common/Makefile
          else
            echo "未指定 SUBLEVEL，保持默认"
          fi

          # 读取修改后的版本
          NEW_VERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' ./common/Makefile)

          if [ "$ORIG_VERSION" != "$NEW_VERSION" ]; then
            echo "Kernel Version:$ORIG_VERSION->$NEW_VERSION"
            echo "TKERNEL_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          else
            echo "Kernel Version:$ORIG_VERSION No changes"
            echo "TKERNEL_VERSION=$ORIG_VERSION" >> $GITHUB_ENV
          fi

          # 内核版本的数字转换(对比用)
          echo "KV1=${KMI#*-}"       | cut -d. -f1 >> $GITHUB_ENV
          echo "KV2=${KMI#*-}"       | tr -d '.' >> $GITHUB_ENV
          echo "KV3=${NEW_VERSION}"     | tr -d '.' >> $GITHUB_ENV
          echo "KERNEL_SHORT_PATCH_VERSION=$(echo $NEW_VERSION | cut -d. -f1,2 | tr '.' '_')" >> $GITHUB_ENV

      - name: Rust Version Handling
        run: |
          cd kernel_workspace/kernel_platform
          # 从 build.config.constants 读取 RUSTC_VERSION
          RUSTC_VERSION=""
          if [[ -f ./common/build.config.constants ]]; then
            RUSTC_VERSION=$(grep '^RUSTC_VERSION=' ./common/build.config.constants | cut -d'=' -f2 || true)
          fi
          if [[ -n "$RUSTC_VERSION" ]]; then
            echo "✅ RUSTC_VERSION=$RUSTC_VERSION"
            echo "RUSTC_VERSION=$RUSTC_VERSION" >> $GITHUB_ENV
            echo "ENABLE_RUST=true" >> $GITHUB_ENV
          else
            echo "✅ RUSTC_VERSION 未找到，Rust 编译已禁用"
            echo "ENABLE_RUST=false" >> $GITHUB_ENV
          fi

      - name: Resolve Kernel Suffix for vm_bridge target
        shell: bash
        env:
          BUILD_VM_BRIDGE: ${{ env.VM_BRIDGE_BUILD }}
          REQUESTED_SUFFIX: ${{ github.event.inputs.SUFFIX }}
          VM_BRIDGE_TARGET_RELEASE: ${{ env.VM_BRIDGE_TARGET_RELEASE }}
        run: |
          # CTF|认证
          set -euo pipefail
          EFFECTIVE_SUFFIX="$REQUESTED_SUFFIX"
          if [[ "$BUILD_VM_BRIDGE" == "true" && -n "$VM_BRIDGE_TARGET_RELEASE" ]]; then
            RELEASE_PREFIX="${TKERNEL_VERSION}-${KANDROID_VERSION}-"
            if [[ "$VM_BRIDGE_TARGET_RELEASE" != "$RELEASE_PREFIX"* ]]; then
              echo "目标 release 与当前内核基线不一致: target=$VM_BRIDGE_TARGET_RELEASE prefix=$RELEASE_PREFIX" >&2
              exit 1
            fi
            TARGET_SUFFIX="${VM_BRIDGE_TARGET_RELEASE#"$RELEASE_PREFIX"}"
            test -n "$TARGET_SUFFIX"
            if [[ "$REQUESTED_SUFFIX" == "-1" ]]; then
              echo "vm_bridge 精确 ABI 构建不能禁用内核后缀" >&2
              exit 1
            fi
            if [[ -n "$REQUESTED_SUFFIX" && "$REQUESTED_SUFFIX" != "$TARGET_SUFFIX" ]]; then
              echo "SUFFIX 与目标 release 不匹配: requested=$REQUESTED_SUFFIX required=$TARGET_SUFFIX" >&2
              exit 1
            fi
            EFFECTIVE_SUFFIX="$TARGET_SUFFIX"
          fi
          echo "EFFECTIVE_SUFFIX=$EFFECTIVE_SUFFIX" >> "$GITHUB_ENV"
          echo "Resolved kernel suffix: ${EFFECTIVE_SUFFIX:-<random>}"

      # 自定义内核后缀
      - name: Custom Kernel Suffix if set
        if: ${{ env.EFFECTIVE_SUFFIX != '' && env.EFFECTIVE_SUFFIX != '-1' }}
        run: |
          cd kernel_workspace/kernel_platform
          SUFFIX="${{ env.EFFECTIVE_SUFFIX }}"
          FAST_BUILD="${{ github.event.inputs.FAST_BUILD }}"

          for f in ./common/scripts/setlocalversion ./"$KERNEL_REPOS"/scripts/setlocalversion ./external/dtc/scripts/setlocalversion; do
            [ -f "$f" ] || continue
            echo "Modifying: $f"

            # Remove -dirty
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"

            if grep -q 'KERNELVERSION.*scm_version' "$f"; then
              echo "Detected NEW setlocalversion format"
              sed -i "s|echo \"\${KERNELVERSION}.*scm_version}\"|echo \"\${KERNELVERSION}-${KANDROID_VERSION}-${SUFFIX}\"|" "$f"
            elif grep -q 'echo "\$res"' "$f"; then
              echo "Detected OLD setlocalversion format"
              if [ "$FAST_BUILD" = "true" ]; then
                echo "FAST_BUILD enabled: using static res"
                sed -i "s/^res=.*/res=\"-${KANDROID_VERSION}-${SUFFIX}\"/" "$f"
              else
                echo "Standard build: injecting suffix via cut/echo"
                if [[ -f ./build_with_bazel.py ]]; then
                  echo "使用官方脚本编译且当使用 build_with_bazel 时，可能受特殊符号数量限制，编译失败请修改"
                  echo "When using the official script and building with build_with_bazel, the build may fail due to a limit on the number of special characters. Please modify the configuration if that happens."
                fi
                tac "$f" | sed "0,/echo \"\\\$res\"/s//res=\\\$(echo \\\$res | cut -d- -f1-2)-${SUFFIX}; echo \"\\\$res\";/" | tac > "$f.tmp" && mv "$f.tmp" "$f"
              fi
            else
              echo "Unknown format, appending echo manually"
              echo "echo \"\$res-${SUFFIX}\"" >> "$f"
            fi
            chmod +x "$f"
          done

      # 伪官方格式的随机后缀（仅在 SUFFIX 未设置时生效）*
      - name: Custom Kernel Random Suffix if empty
        if: ${{ env.EFFECTIVE_SUFFIX == '' }}
        run: |
          cd kernel_workspace/kernel_platform
          FAST_BUILD="${{ github.event.inputs.FAST_BUILD }}"

          # 生成随机数字和随机hash
          RANDOM_DIGIT=$(od -An -N1 -tu1 < /dev/urandom | tr -d '[:space:]' | awk '{print $1 % 11}')
          RANDOM_HASH=$(od -An -N7 -tx1 /dev/urandom | tr -d ' \n')
          RANDOM_SUFFIX="${RANDOM_DIGIT}-o-g${RANDOM_HASH}"

          for f in ./common/scripts/setlocalversion ./"$KERNEL_REPOS"/scripts/setlocalversion ./external/dtc/scripts/setlocalversion; do
            [ -f "$f" ] || continue
            echo "Modifying: $f"

            # Remove -dirty
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"

            if grep -q 'KERNELVERSION.*scm_version' "$f"; then
              echo "Detected NEW setlocalversion format"
              sed -i "s|echo \"\${KERNELVERSION}.*scm_version}\"|echo \"\${KERNELVERSION}-${KANDROID_VERSION}-${RANDOM_SUFFIX}\"|" "$f"
            elif grep -q 'echo "\$res"' "$f"; then
              echo "Detected OLD setlocalversion format"
              if [ "$FAST_BUILD" = "true" ]; then
                echo "FAST_BUILD enabled: using static res with random suffix"
                sed -i "s/^res=.*/res=\"-${KANDROID_VERSION}-${RANDOM_SUFFIX}\"/" "$f"
              else
                echo "Standard build: injecting random suffix via cut/echo"
                tac "$f" | sed "0,/echo \"\\\$res\"/s//res=\\\$(echo \\\$res | cut -d- -f1-2)-${RANDOM_SUFFIX}; echo \"\\\$res\";/" | tac > "$f.tmp" && mv "$f.tmp" "$f"
              fi
            else
              echo "Unknown format, appending echo manually"
              echo "echo \"\$res-${RANDOM_SUFFIX}\"" >> "$f"
            fi
            chmod +x "$f"
          done

      - name: Resolve Manager Source
        id: manager
        run: |
          MANAGER_SOURCE="${{ github.event.inputs.MANAGER_SOURCE }}"

          case "$MANAGER_SOURCE" in
            MD3)
              BRANCH="old"
              ARTIFACT="manager"
              ;;
            MD3_SPOOF)
              BRANCH="old"
              ARTIFACT="Spoofed-Manager"
              ;;
            MIUIX_SPOOF)
              BRANCH="main"
              ARTIFACT="Spoofed-Manager"
              ;;
            MIUIX|*)
              BRANCH="main"
              ARTIFACT="manager"
              ;;
          esac

          echo "manager_branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "manager_artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Add SukiSU Ultra
        env:
          BUILD_VM_BRIDGE: ${{ env.VM_BRIDGE_BUILD }}
        run: |
          cd kernel_workspace/kernel_platform
          MANAGER_BRANCH="${{ steps.manager.outputs.manager_branch }}"
          KSU_META="${{ github.event.inputs.KSU_META }}"

          # 必须包含两个分隔符（至少三个字段）
          if [[ "$(grep -o '/' <<< "$KSU_META" | wc -l)" -lt 2 ]]; then
            echo "错误: KSU_META 参数缺少必要的分隔符 '/'，格式应为: 分支名/自定义标识(可省略)/提交hash(可省略)"
            exit 10
          fi

          # 解析字段：分支 / 自定义标识 / 手动 hash
          IFS='/' read -r BRANCH_NAME CUSTOM_TAG MANUAL_HASH <<< "$KSU_META"
          if [[ "$BUILD_VM_BRIDGE" == "true" ]]; then
            MANUAL_HASH="b88403d2561b6e00dff84a3c851e630c62f57fd0"
            SETUP_REF="7cd3be6187d464784ba96644b44fad085477d753"
          else
            SETUP_REF="$MANAGER_BRANCH"
          fi

          echo "分支名: $BRANCH_NAME"
          [[ -n "$CUSTOM_TAG" ]] && echo "自定义版本标识: $CUSTOM_TAG" || echo "自定义版本标识: 未启用"
          [[ -n "$MANUAL_HASH" ]] && echo "手动指定 hash: $MANUAL_HASH" || echo "手动指定 hash: 未启用"

          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${SETUP_REF}/kernel/setup.sh" | bash -s "$BRANCH_NAME"
          cd ./KernelSU

          # 如果指定了手动 hash，就切换到该提交
          if [[ -n "$MANUAL_HASH" ]]; then
            git fetch origin "$MANUAL_HASH"
            git checkout --detach "$MANUAL_HASH"
            test "$(git rev-parse HEAD)" = "$MANUAL_HASH"
            SHORT_HASH=${MANUAL_HASH:0:8}
          fi

          # 本地 SUSFS 增强：让 SukiSU builtin 分支识别 FILE_SPOOF / SUS_MAP_UID 新能力
          python3 - <<'PY'
          from pathlib import Path
          
          kconfig = Path("kernel/Kconfig")
          if kconfig.exists():
              text = kconfig.read_text()
              if "config KSU_SUSFS_SPOOF_FILE" not in text:
                  block = "\n".join([
                      "config KSU_SUSFS_SPOOF_FILE",
                      "\tbool \"Enable to spoof file read content\"",
                      "\tdepends on KSU_SUSFS",
                      "\tdefault y",
                      "\thelp",
                      "\t  - Allow replacing read/readv/iocb read output of a target procfs/sysfs/regular file with user-defined content.",
                      "\t  - Useful for small identity files like /proc/cpuinfo, /proc/device-tree/model and /sys/devices/soc0/* without bind mounts.",
                      "\t  - Effective only on processes with pre-defined uid scheme.",
                      "",
                  ])
                  text = text.replace("config KSU_SUSFS_SUS_MAP", block + "config KSU_SUSFS_SUS_MAP", 1)
                  kconfig.write_text(text)
          
          dispatch = Path("kernel/supercall/dispatch.c")
          if dispatch.exists():
              text = dispatch.read_text()
              if "CMD_SUSFS_ADD_FILE_SPOOF" not in text:
                  block = "\n".join([
                      "#ifdef CONFIG_KSU_SUSFS_SPOOF_FILE",
                      "        case CMD_SUSFS_ADD_FILE_SPOOF:",
                      "            susfs_add_file_spoof(arg);",
                      "            return 0;",
                      "#endif // #ifdef CONFIG_KSU_SUSFS_SPOOF_FILE",
                  ]) + "\n"
                  text = text.replace("#ifdef CONFIG_KSU_SUSFS_SUS_MAP", block + "#ifdef CONFIG_KSU_SUSFS_SUS_MAP", 1)
              if "CMD_SUSFS_ADD_SUS_MAP_UID" not in text:
                  old = "\n".join([
                      "        case CMD_SUSFS_ADD_SUS_MAP:",
                      "            susfs_add_sus_map(arg);",
                      "            return 0;",
                  ])
                  new = old + "\n" + "\n".join([
                      "        case CMD_SUSFS_ADD_SUS_MAP_UID:",
                      "            susfs_add_sus_map_uid(arg);",
                      "            return 0;",
                  ])
                  if old in text:
                      text = text.replace(old, new, 1)
                  else:
                      block = "\n".join([
                          "#ifdef CONFIG_KSU_SUSFS_SUS_MAP",
                          "        case CMD_SUSFS_ADD_SUS_MAP_UID:",
                          "            susfs_add_sus_map_uid(arg);",
                          "            return 0;",
                          "#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MAP",
                      ]) + "\n"
                      text = text.replace("        default:", block + "        default:", 1)
              dispatch.write_text(text)
          PY
          
          if [[ "$BUILD_VM_BRIDGE" == "true" ]]; then
            KSU_VERSION_TAG="4.1.3"
          else
            KSU_VERSION_TAG=$(curl -fsSL https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/releases/latest \
              | grep '"tag_name":' | sed -E 's/.*"v?([^"]+)".*/\1/')
            if [[ -z "$KSU_VERSION_TAG" || "$(printf '%s\n' "$KSU_VERSION_TAG" "3.1.7" | sort -V | head -n1)" != "3.1.7" ]]; then
              KSU_VERSION_TAG="3.1.7"
            fi
          fi
          echo "KSU_VERSION_TAG=$KSU_VERSION_TAG" >> $GITHUB_ENV
          
          GIT_HASH=$(git rev-parse --short HEAD)
          echo "GIT_HASH=$GIT_HASH"
          
          # 组装版本号
          if [[ -n "$MANUAL_HASH" ]]; then
            USE_HASH="$SHORT_HASH"
          else
            USE_HASH="$GIT_HASH"
          fi
          if [[ -z "$CUSTOM_TAG" ]]; then
            VERSION_FULL="v$KSU_VERSION_TAG-$USE_HASH@$BRANCH_NAME"
          else
            VERSION_FULL="v$KSU_VERSION_TAG-$CUSTOM_TAG@$BRANCH_NAME[$USE_HASH]"
          fi
          
          ESC_VERSION_FULL=$(printf '%s' "$VERSION_FULL" | sed 's/[&|\\/]/\\&/g')
          ESC_KSU_VERSION_TAG=$(printf '%s' "$KSU_VERSION_TAG" | sed 's/[&|\\/]/\\&/g')
          
          if grep -q '^KSU_VERSION_FULL := ' kernel/Makefile; then
            sed -i "s|^KSU_VERSION_FULL := .*|KSU_VERSION_FULL := $ESC_VERSION_FULL|" kernel/Makefile
          else
            awk -v full="$VERSION_FULL" '
              /^REPO_OWNER :=/ && !done {
                print
                print ""
                print "KSU_VERSION_FULL := " full
                done=1
                next
              }
              { print }
            ' kernel/Makefile > kernel/Makefile.tmp && mv kernel/Makefile.tmp kernel/Makefile
          fi
          
          if grep -q '^KSU_VERSION_API := ' kernel/Makefile; then
            sed -i "s|^KSU_VERSION_API := .*|KSU_VERSION_API := $ESC_KSU_VERSION_TAG|" kernel/Makefile
          fi
          
          KSU_COUNT_REF="${MANUAL_HASH:-$MANAGER_BRANCH}"
          KSU_VERSION=$(expr $(git rev-list --count "$KSU_COUNT_REF" 2>/dev/null || echo 13000) + 37185)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          
          echo "::group::最终 Makefile 中版本信息及部分调试结果预览"
          grep -nE '^(REPO_OWNER|REPO_NAME|REPO_BRANCH|KSU_VERSION_API|KSU_VERSION_FULL|VERSION_TAG|GIT_BIN|CURL_BIN)' kernel/Makefile
          echo "::endgroup::"
          
      - name: Apply Patches SukiSU Ultra
        env:
          FILE: ${{ github.event.inputs.FILE }}
          SUSFS_REPO_TOKEN: ${{ secrets.SUSFS_REPO_TOKEN }}
        run: |
          cd kernel_workspace
          if [ "${{ github.event.inputs.SUSFS_META }}" != "-1" ]; then
            SUSFS_META="${{ github.event.inputs.SUSFS_META }}"
            # 优先使用已固定在当前 checkout 中的 SUSFS 快照；只有快照缺失时才允许远端回退。
            SUSFS_REPO_URL="https://github.com/1jsuwgsjw/susfs4ksu-gki-android15-6.6--.git"
            SUSFS_PATCH_NAME=""
            SUSFS_SOURCE_ROOT=""
            for candidate in \
              "$GITHUB_WORKSPACE/kernel_patches" \
              "$GITHUB_WORKSPACE/kernel_workspace/Action-Build/kernel_patches"; do
              patch_path="$(find "$candidate" -maxdepth 1 -type f -name '50_add_susfs_in_gki-*.patch' -print -quit 2>/dev/null || true)"
              if [ -n "$patch_path" ] && [ -f "$candidate/SOURCE_COMMIT" ]; then
                SUSFS_SOURCE_ROOT="$candidate"
                SUSFS_PATCH_NAME="$(basename "$patch_path")"
                break
              fi
            done
            if [ -z "$SUSFS_SOURCE_ROOT" ]; then
              patch_path="$(find "$GITHUB_WORKSPACE" -type f -name '50_add_susfs_in_gki-*.patch' -print -quit 2>/dev/null || true)"
              if [ -n "$patch_path" ]; then
                candidate="$(dirname "$patch_path")"
                if [ -f "$candidate/SOURCE_COMMIT" ]; then
                  SUSFS_SOURCE_ROOT="$candidate"
                  SUSFS_PATCH_NAME="$(basename "$patch_path")"
                fi
              fi
            fi

            if [ -n "$SUSFS_SOURCE_ROOT" ]; then
              echo "检测到固定 SUSFS 快照: $SUSFS_SOURCE_ROOT (commit $(tr -d '[:space:]' < "$SUSFS_SOURCE_ROOT/SOURCE_COMMIT"))"
              mkdir -p susfs4ksu
              cp -a "$SUSFS_SOURCE_ROOT" susfs4ksu/kernel_patches
              [ -d "$GITHUB_WORKSPACE/ksu_susfs" ] && cp -a "$GITHUB_WORKSPACE/ksu_susfs" susfs4ksu/ || true
              [ -d "$GITHUB_WORKSPACE/ksu_module_susfs" ] && cp -a "$GITHUB_WORKSPACE/ksu_module_susfs" susfs4ksu/ || true
              [ -f "$GITHUB_WORKSPACE/build_ksu_susfs_tool.sh" ] && cp -a "$GITHUB_WORKSPACE/build_ksu_susfs_tool.sh" susfs4ksu/ || true
              [ -f "$GITHUB_WORKSPACE/build_ksu_module.sh" ] && cp -a "$GITHUB_WORKSPACE/build_ksu_module.sh" susfs4ksu/ || true
            elif [[ "$VM_BRIDGE_BUILD" == "true" ]]; then
              echo "::error title=Vendored SUSFS snapshot missing::vm_bridge 精确构建禁止回退到远端 SUSFS；固定快照未进入 kernel_workspace。"
              exit 129
            elif [ -n "${SUSFS_REPO_TOKEN:-}" ]; then
              echo "使用 SUSFS_REPO_TOKEN 拉取私有/受限 SUSFS 仓库"
              git clone "https://x-access-token:${SUSFS_REPO_TOKEN}@github.com/1jsuwgsjw/susfs4ksu-gki-android15-6.6--.git" -b main susfs4ksu
              git -C susfs4ksu remote set-url origin "$SUSFS_REPO_URL"
            else
              if ! git ls-remote "$SUSFS_REPO_URL" >/dev/null 2>&1; then
                echo "::error title=SUSFS repo inaccessible::当前工作区没有 kernel_patches，且无法匿名访问 $SUSFS_REPO_URL。请确认 workflow 放在 SUSFS 仓库内，或把 SUSFS 仓库设为 Public，或新增 SUSFS_REPO_TOKEN。"
                exit 128
              fi
              git clone "$SUSFS_REPO_URL" -b main susfs4ksu
            fi
          
            cd susfs4ksu
            if [ -n "$SUSFS_META" ] && [ -d .git ]; then
              if [[ "$SUSFS_META" =~ ^[0-9]+$ ]]; then
                git checkout HEAD~$SUSFS_META
              else
                git checkout "$SUSFS_META"
              fi
            elif [ -n "$SUSFS_META" ]; then
              echo "::warning title=SUSFS_META ignored::当前使用本地 checkout 补丁目录，不是 git clone 仓库，已忽略 SUSFS_META=$SUSFS_META"
            else
              echo "SUSFS_META 为空，使用本仓库 main/latest checkout SUSFS"
            fi
            cd ..
          fi
          if [ "${{ github.event.inputs.RE_KERNEL }}" = "true" ]; then
            git clone https://github.com/Sakion-Team/Re-Kernel.git
          fi
          if [ "${{ github.event.inputs.LZ4_UPDATE }}" = "true" ]; then
            git clone https://github.com/Numbersf/lz4_oplus.git
          fi
          git clone https://github.com/ShirkNeko/SukiSU_patch.git
          if [[ "${{ env.VM_BRIDGE_BUILD }}" == "true" ]]; then
            git -C SukiSU_patch checkout --detach 547ae94bcaec53d030398f857950c64662043a5d
            test "$(git -C SukiSU_patch rev-parse HEAD)" = "547ae94bcaec53d030398f857950c64662043a5d"
          fi
          cd kernel_platform
          if [ "${{ github.event.inputs.SUSFS_META }}" != "-1" ]; then
            echo "正在拉取susfs补丁"
            cp "../susfs4ksu/kernel_patches/$SUSFS_PATCH_NAME" ./common/
            cp ../susfs4ksu/kernel_patches/fs/* ./common/fs/
            cp ../susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
          fi
          
          if [[ "${{ github.event.inputs.ZRAM }}" == 1* ]]; then
            echo "正在拉取zram补丁"
            cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./common/include/linux/
            cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./common/lib/
            cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./common/crypto/
            cp -r ../SukiSU_patch/other/zram/lz4k_oplus ./common/lib/
          fi
          
          cd ./common
          SUBLEVEL=$(grep '^SUBLEVEL *=' Makefile | head -n1 | cut -d= -f2 | tr -d ' ')
          
          if [ "$KMI" == "android13-5.15" ] && [ "$SUBLEVEL" -lt 123 ]; then
            echo "修复内核版本为5.15.0~5.15.123仅支持旧版C库造成的一些bug"
            cp ../../Action-Build/patches/fix_5.15.legacy ./fix_5.15.legacy.patch
            patch -p1 < fix_5.15.legacy.patch
            echo "fix_5.15_patch完成"
          fi
          
          if [[ "${{ env.KV2 }}" == "66" && "${{ env.KV3 }}" -le 6630 && "${{ github.event.inputs.SUSFS_META }}" != "-1" ]]; then
            TRUSTY_EXISTS="false"
            if grep -q 'common-modules/trusty' "$GITHUB_WORKSPACE/.repo/manifests_fallback/${FILE}.xml"; then
              TRUSTY_EXISTS="true"
            fi
            if [[ "$TRUSTY_EXISTS" == "false" ]]; then
              echo "修复内核版本为6.6.0~6.6.30的机型源码及清单中缺失TrustyOS导致的susfs报错"
              sed -i 's/-32,12 +32,38/-32,11 +32,37/g' "$SUSFS_PATCH_NAME"
              sed -i '/#include <trace\/hooks\/fs.h>/d' "$SUSFS_PATCH_NAME"
            fi
          fi
          
          if [ "${{ github.event.inputs.SUSFS_META }}" != "-1" ]; then
            # Fake Patch to fix failures
            fake_patched=0
            fake_patched_dist=0
            fake_patched_swap=0
            fake_patched_ns=0
            fake_patched_expand=0
            if [ "$KMI" = "android15-6.6" ]; then
              if ! grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c; then
                echo "未找到 nr_subpages，正在进行补丁修复"
                sed -i -e '/int ret = 0, copied = 0;/a \\tunsigned int nr_subpages \= __PAGE_SIZE \/ PAGE_SIZE;' -e '/int ret = 0, copied = 0;/a \\tpagemap_entry_t \*res = NULL;' ./fs/proc/task_mmu.c
                fake_patched=1
              fi
              if ! grep -qxF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
                echo "未找到 #include <linux/dma-buf.h>，添加缺失的头文件"
                sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux\/dma-buf.h>' ./fs/proc/base.c
              fi
              if ! grep -qxF '#include <linux/zswap.h>' ./mm/memory.c; then
                echo "未找到 #include <linux/zswap.h>，添加缺失的头文件"
                sed -i '/#include <linux\/sched\/sysctl\.h>/a #include <linux\/zswap.h>' ./mm/memory.c
                fake_patched_swap=1
              fi
              if ! grep -qxF '#include <trace/hooks/fs.h>' ./fs/namespace.c && ! grep -qxF 'susfs_def.h' ./fs/namespace.c; then
                echo "未找到 #include <trace/hooks/fs.h>，添加缺失的头文件"
                sed -i '/#include <trace\/hooks\/blk\.h>/a #include <trace\/hooks\/fs.h>' ./fs/namespace.c
                fake_patched_ns=1
              fi
              if grep -qF 'if (vma->vm_end > last_vma_end)' ./fs/proc/task_mmu.c && ! grep -qF 'if (vma->vm_end > last_vma_end) {' ./fs/proc/task_mmu.c; then
                echo "临时展开 last_vma_end if 块，修复匹配问题"
                perl -i -0pe 's/\t\t\tif \(vma->vm_end > last_vma_end\)\n\t\t\t\tsmap_gather_stats\(vma, &mss, last_vma_end\);/\t\t\tif (vma->vm_end > last_vma_end) {\n\t\t\t\tsmap_gather_stats(vma, \&mss, last_vma_end);\n\t\t\t\tlast_vma_end = vma->vm_end;\n\t\t\t}/' ./fs/proc/task_mmu.c
                fake_patched_expand=1
              fi
            fi
            if [ "$KMI" = "android14-6.1" ]; then
              if ! grep -qxF $'\tif (!vma_pages(vma))' ./fs/proc/task_mmu.c; then
                echo "未找到 vma_pages，正在进行补丁修复"
                fake_patched=1
              fi
              if ! grep -qxF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
                echo "未找到 #include <linux/dma-buf.h>，添加缺失的头文件"
                sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux\/dma-buf.h>' ./fs/proc/base.c
              fi
            fi
            if [ "$KMI" = "android12-5.10" ] || [ "$KMI" = "android13-5.15" ]; then
              if ! grep -qxF $'\tif (!vma_pages(vma))' ./fs/proc/task_mmu.c; then
                echo "未找到 vma_pages，正在进行补丁修复"
                fake_patched=1
              fi
            fi
            if [ "$KMI" = "android13-5.15" ]; then
              if grep -qxF '#include <linux/swap_slots.h>' ./mm/memory.c && ! grep -qxF '#include <linux/susfs_def.h>' ./mm/memory.c; then
                echo "发现干扰识别的 swap_slots.h，临时移除"
                sed -i '/#include <linux\/swap_slots\.h>/d' ./mm/memory.c
                fake_patched_dist=1
              fi
            fi
          
            echo "正在打susfs补丁"
            patch -p1 < "$SUSFS_PATCH_NAME" || true
            echo "susfs_patch完成"
          
            # Revert
            if [ "$fake_patched" = 1 ]; then
              if [ "$KMI" = "android15-6.6" ]; then
                if grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c; then
                  sed -i -e '/unsigned int nr_subpages \= __PAGE_SIZE \/ PAGE_SIZE;/d' -e '/pagemap_entry_t \*res = NULL;/d' ./fs/proc/task_mmu.c
                fi
              fi
              if [ "$KMI" = "android12-5.10" ] || [ "$KMI" = "android13-5.15" ] || [ "$KMI" = "android14-6.1" ]; then
                if grep -q 'goto[[:space:]]\+show_pad;' ./fs/proc/task_mmu.c; then
                  sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
                fi
              fi
            fi
            if [ "$fake_patched_dist" = 1 ]; then
              if [ "$KMI" = "android13-5.15" ]; then
                if ! grep -qxF '#include <linux/swap_slots.h>' ./mm/memory.c; then
                  sed -i '/#ifdef CONFIG_KSU_SUSFS_SUS_MAP/i #include <linux/swap_slots.h>' ./mm/memory.c
                fi
              fi
            fi
            if [ "$fake_patched_swap" = 1 ]; then
              if [ "$KMI" = "android15-6.6" ]; then
                if grep -qxF '#include <linux/zswap.h>' ./mm/memory.c; then
                  sed -i '/#include <linux\/zswap\.h>/d' ./mm/memory.c
                fi
              fi
            fi
            if [ "$fake_patched_ns" = 1 ]; then
              if grep -qxF '#include <trace/hooks/fs.h>' ./fs/namespace.c && ! grep -qxF 'susfs_def.h' ./fs/namespace.c; then
                sed -i '/#include <trace\/hooks\/fs\.h>/d' ./fs/namespace.c
              fi
            fi
            if [ "$fake_patched_expand" = 1 ]; then
              if [ "$KMI" = "android15-6.6" ]; then
                if grep -qF 'if (vma->vm_end > last_vma_end) {' ./fs/proc/task_mmu.c; then
                  perl -i -0pe 's/\t\t\tif \(vma->vm_end > last_vma_end\) \{\n\t\t\t\tsmap_gather_stats\(vma, &mss, last_vma_end\);\n\t\t\t\tlast_vma_end = vma->vm_end;\n\t\t\t\}/\t\t\tif (vma->vm_end > last_vma_end)\n\t\t\t\tsmap_gather_stats(vma, \&mss, last_vma_end);/' ./fs/proc/task_mmu.c
                fi
              fi
            fi
          fi
          
          source $REJ_CHECKER
          check_rejects .
          
      # OGKI转换GKI，无需修改 dtbo 开机
      - name: Apply Convert HMBIRD_OGKI to HMBIRD_GKI
        if: ${{ fromJSON(env.KV1) >= 6 && fromJSON(env.KV2) >= 66 && github.event.inputs.SCHED_HMBIRD == 'false' }}
        run: |
          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches"
          cd kernel_workspace/kernel_platform/common
          for p in ./kernel/sched/hmbird* ./vendor/oplus/kernel/cpu/sched_ext/hmbird*; do
            [ -d "$p" ] && {
              echo "源码中风驰代码已经存在，启用二次回退"
              exit 0
            }
          done
          sed -i '1iobj-y += hmbird_patch.o' drivers/Makefile
          echo "正在打OGKI转换GKI补丁"
          patch -p1 -F 3 < "${PATCH_DIR}/hmbird_patch.patch" || true
          echo "OGKI转换GKI_patch完成"
          source $REJ_CHECKER
          check_rejects .
          
      - name: Apply UNICODE_BYPASS
        if: ${{ github.event.inputs.UNICODE_BYPASS == 'true' }}
        run: |
          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches"
          cd kernel_workspace/kernel_platform/common
          if [ "$KV1" -lt 6 ]; then
            patch -p1 --forward < "${PATCH_DIR}/unicode_bypass_fix_6.1-.patch" || true
          else
            patch -p1 --forward < "${PATCH_DIR}/unicode_bypass_fix_6.1+.patch" || true
          fi
          source $REJ_CHECKER
          check_rejects .
          
      - name: Apply RE_KERNEL
        if: ${{ github.event.inputs.RE_KERNEL == 'true' }}
        run: |
          RE_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Re-Kernel/LKM-Source"
          cd kernel_workspace/kernel_platform/common
          sed -i '/endmenu/i source "drivers/rekernel/Kconfig"' drivers/Kconfig
          sed -i '$a \#Re-Kernel Support\nobj-$(CONFIG_REKERNEL) += rekernel/' drivers/Makefile
          mkdir -p drivers/rekernel
          cp ${RE_DIR}/rekernel.c ${RE_DIR}/rekernel.h ${RE_DIR}/Makefile ${RE_DIR}/Kconfig drivers/rekernel/
          sed -i "s|^\s*//\s*#define KERNEL_${KERNEL_SHORT_PATCH_VERSION}|\#define KERNEL_${KERNEL_SHORT_PATCH_VERSION}|" drivers/rekernel/rekernel.h
          
      - name: Apply DROID_SPACES
        env:
          FILE: ${{ github.event.inputs.FILE }}
        if: ${{ github.event.inputs.DROID_SPACES == 'true' }}
        run: |
          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches"
          cd kernel_workspace/kernel_platform/common
          # 注释掉原始的 sysv 结构体定义
          sed -i 's/^\(\t\)struct sysv_sem\b.*sysvsem;/\1\/\/ struct sysv_sem\t\t\tsysvsem;/' include/linux/sched.h
          sed -i 's/^\(\t\)struct sysv_shm\b.*sysvshm;/\1\/\/ struct sysv_shm\t\t\tsysvshm;/' include/linux/sched.h
          
          if [ "$KMI" = "android12-5.10" ]; then
            echo "为 android12-5.10 修复 sysvipc KABI 绕过及 POSIX_MQUEUE ABI 填充问题..."
            sed -i '/^\tconst struct sched_class\t\*sched_class;/a \\n#ifndef __GENKSYMS__\n\tstruct sysv_sem\t\t\tsysvsem;\n\tstruct sysv_shm\t\t\tsysvshm;\n#endif\n' include/linux/sched.h
            sed -i 's/^\tunsigned long mq_bytes;\t\/\* How many bytes can be allocated to mqueue[?] \*\//\t\/\/unsigned long mq_bytes;\t\/* How many bytes can be allocated to mqueue? *\//' include/linux/sched/user.h
            sed -i '/struct ratelimit_state ratelimit;/,/ANDROID_OEM_DATA_ARRAY(1, 2);/{/^\tANDROID_KABI_RESERVE(1);/{N;N;s/^\tANDROID_KABI_RESERVE(1);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_OEM_DATA_ARRAY(1, 2);/#if defined(CONFIG_POSIX_MQUEUE)\n\tANDROID_KABI_USE(1, unsigned long mq_bytes);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_OEM_DATA_ARRAY(1, 2);\n#else\n\tANDROID_KABI_RESERVE(1);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_OEM_DATA_ARRAY(1, 2);\n#endif/}}' include/linux/sched/user.h
          # 检查 sched.h 并修改 KABI 槽位或指针
          elif grep -q "sched_dl_entity.*\*dl_server" include/linux/sched.h; then
            echo "✅ 检测到 dl_server 指针，使用 packed union 方案"
            sed -i 's|\tstruct sched_entity\t\tse;|#ifdef CONFIG_SYSVIPC\n\tunion {\n\t\tchar __kabi_ignored_0;\n\t\tstruct sysv_sem\t\t\tsysvsem;\n\t}__attribute__((packed));\n\tunion {\n\t\tchar __kabi_ignored_1;\n\t\tstruct sysv_shm\t\t\tsysvshm;\n\t}__attribute__((packed));\n#endif\n\n\tstruct sched_entity\t\tse;|' include/linux/sched.h
          elif grep -q "ANDROID_KABI_USE(1," include/linux/sched.h; then
            echo "✅ 检测到 USE(1)，使用槽位 6,7,8"
            sed -i -e '/ANDROID_KABI_RESERVE(6);/{N;N;s|\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);|#ifdef CONFIG_SYSVIPC\n\tANDROID_KABI_USE(6, struct sysv_sem sysvsem);\n\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(7); ANDROID_KABI_RESERVE(8), struct sysv_shm sysvshm);\n#else\n\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);\n#endif|;}' include/linux/sched.h
          elif grep -q "ANDROID_KABI_RESERVE(1);" include/linux/sched.h; then
            echo "✅ 检测到 RESERVE(1)，使用槽位 1,2,3"
            sed -i -e '/ANDROID_KABI_RESERVE(1);/{N;N;N;N;N;N;N;s|\tANDROID_KABI_RESERVE(1);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_KABI_RESERVE(3);\n\tANDROID_KABI_RESERVE(4);\n\tANDROID_KABI_RESERVE(5);\n\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);|#ifdef CONFIG_SYSVIPC\n\tANDROID_KABI_USE(1, struct sysv_sem sysvsem);\n\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(2); ANDROID_KABI_RESERVE(3), struct sysv_shm sysvshm);\n#else\n\tANDROID_KABI_RESERVE(1);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_KABI_RESERVE(3);\n#endif\n\tANDROID_KABI_RESERVE(4);\n\tANDROID_KABI_RESERVE(5);\n\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);|;}' include/linux/sched.h
          elif grep -q "ANDROID_KABI_RESERVE(3);" include/linux/sched.h; then
            echo "✅ fallback，使用槽位 3,4,5"
            sed -i -e '/ANDROID_KABI_RESERVE(3);/{N;N;N;s|\tANDROID_KABI_RESERVE(3);\n\tANDROID_KABI_RESERVE(4);\n\tANDROID_KABI_RESERVE(5);\n\tANDROID_KABI_RESERVE(6);|#ifdef CONFIG_SYSVIPC\n\tANDROID_KABI_USE(3, struct sysv_sem sysvsem);\n\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(4); ANDROID_KABI_RESERVE(5), struct sysv_shm sysvshm);\n#else\n\tANDROID_KABI_RESERVE(3);\n\tANDROID_KABI_RESERVE(4);\n\tANDROID_KABI_RESERVE(5);\n#endif\n\tANDROID_KABI_RESERVE(6);|;}' include/linux/sched.h
          else
            echo "❌ 无法通过上下文精准匹配 KABI 槽位或对应指针"
            exit 9
          fi
          
          echo "为 oplus_bsp_midas 模块返回幽灵任务以避免空指针崩溃..."
          patch -p1 --forward < "${PATCH_DIR}/ghost-task-for-midas.patch" || true
          
          if [ "$KMI" = "android16-6.12" ]; then
            rm -f include/uapi/linux/ntsync.h
            rm -f drivers/misc/ntsync.c
            echo "补全 IPC NS 符号导出..."
            if ! grep -q 'EXPORT_SYMBOL.*put_ipc_ns' ./ipc/namespace.c; then
              echo -e '\nEXPORT_SYMBOL_GPL(put_ipc_ns);' >> ./ipc/namespace.c
            fi
            if ! grep -q 'EXPORT_SYMBOL.*init_ipc_ns' ./ipc/msgutil.c; then
              echo -e '\nEXPORT_SYMBOL_GPL(init_ipc_ns);' >> ./ipc/msgutil.c
            fi
          fi
          echo "拓展 ntsync 支持..."
          patch -p1 --forward < "${PATCH_DIR}/ntsync/ntsync_base.patch" || true
          if [[ "$FILE" == oneplus_10r* ]]; then
            patch -p1 --forward < "${PATCH_DIR}/ntsync/ntsync_compat_android12-5.10_14.patch" || true
          else
            patch -p1 --forward < "${PATCH_DIR}/ntsync/ntsync_compat_$([ -f "${PATCH_DIR}/ntsync/ntsync_compat_${KMI}_${ANDROID_SHORT_VERSION}.patch" ] && echo "${KMI}_${ANDROID_SHORT_VERSION}" || echo "${KMI}").patch" || true
          fi
          source $REJ_CHECKER
          check_rejects .
          
      - name: Apply LZ4_DEV
        if: ${{ github.event.inputs.LZ4_UPDATE == 'true' }}
        run: |
          set -euo pipefail
          LZ4_REPO="${GITHUB_WORKSPACE}/kernel_workspace/lz4_oplus"
          cd kernel_workspace/kernel_platform/common
          . "${LZ4_REPO}/apply_lz4_oplus.sh"
          
      - name: Apply ZRAM
        if: startsWith(github.event.inputs.ZRAM, '1/')
        run: |
          ZRAM="${{ github.event.inputs.ZRAM }}"
          if [[ "$(grep -o '/' <<< "$ZRAM" | wc -l)" -lt 2 ]]; then
            echo "错误: ZRAM 参数缺少必要的分隔符 '/'，格式应为: 总开关0关1开/算法名(前面输入0时无效)/大小(前面输入0时无效)"
            exit 10
          fi
          # 解析字段：开关状态 / 算法名 / 大小
          IFS='/' read -r ZRAM_SWSTA ZRAM_ALGO ZRAM_SIZE <<< "$ZRAM"
          echo "ZRAM_ALGO=$ZRAM_ALGO" >> $GITHUB_ENV
          echo "ZRAM_ALGO_U=${ZRAM_ALGO^^}" >> $GITHUB_ENV
          echo "ZRAM_SIZE=$ZRAM_SIZE" >> $GITHUB_ENV
          
          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/SukiSU_patch/other/zram/zram_patch/${{ env.KERNEL_VERSION }}"
          cd kernel_workspace/kernel_platform/common
          if [[ "$KERNEL_VERSION" == "5.10" && "${CPU}" == mt* ]]; then
            sed -i 's/select CRYPTO_LZO/depends on CRYPTO_LZO/' ./mm/oplus_mm/hybridswap_zram/Kconfig
          fi
          echo "正在打lz4kd补丁"
          patch -p1 -F 3 < "${PATCH_DIR}/lz4kd.patch" || true
          echo 'lz4kd_patch完成'
          echo "正在打lz4k_oplus补丁"
          patch -p1 -F 3 < "${PATCH_DIR}/lz4k_oplus.patch" || true
          echo 'lz4k_oplus_patch完成'
          source $REJ_CHECKER
          check_rejects .
          
      - name: Apply SCHED_HMBIRD
        env:
          FILE: ${{ github.event.inputs.FILE }}
        if: ${{ github.event.inputs.SCHED_HMBIRD == 'true' }}
        run: |
          cd kernel_workspace/kernel_platform/common
          CLEAN_FILE="${FILE//_bak/}"
          for p in ./kernel/sched/hmbird* ./vendor/oplus/kernel/cpu/sched_ext/hmbird*; do
            [ -d "$p" ] && {
              echo "源码中风驰代码已经存在，启用二次回退"
              exit 0
            }
          done
          git clone https://github.com/Numbersf/SCHED_PATCH.git -b $CPU || { echo "❌ CPU 分支不存在，风驰内核暂未支持你的机型，请关闭后重试"; exit 11; }
          if [[ "${{ env.VM_BRIDGE_BUILD }}" == "true" ]]; then
            git -C SCHED_PATCH checkout --detach 16e2147f532fab115cc1ca4de9c58917d6500001
            test "$(git -C SCHED_PATCH rev-parse HEAD)" = "16e2147f532fab115cc1ca4de9c58917d6500001"
          fi
          echo "正在拉取风驰补丁"
          cp ./SCHED_PATCH/fengchi_${CLEAN_FILE}.patch ./
          if [[ -f "fengchi_${CLEAN_FILE}.patch" ]]; then
            echo "正在打风驰补丁"
            dos2unix "fengchi_${CLEAN_FILE}.patch"
            patch -p1 -F 3 < "fengchi_${CLEAN_FILE}.patch"
            echo "fengchi_patch完成"
            source $REJ_CHECKER
            check_rejects .
          else
            echo "❌ 未匹配到补丁，风驰内核暂未支持你的机型，请关闭后重试"
            exit 12
          fi
          
      - name: Apply LSM_BBG
        if: ${{ github.event.inputs.LSM_BBG == 'true' }}
        run: |
          cd kernel_workspace/kernel_platform/common
          echo "正在启用内核级基带保护支持…"
          if [[ "${{ env.VM_BRIDGE_BUILD }}" == "true" ]]; then
            git clone https://github.com/vc-teahouse/Baseband-guard.git Baseband-guard
            git -C Baseband-guard checkout --detach cef0daaef94d46022e1f8883ba7a30dfab849dbe
            curl -LSs https://raw.githubusercontent.com/vc-teahouse/Baseband-guard/cef0daaef94d46022e1f8883ba7a30dfab849dbe/setup.sh \
              | bash -s cef0daaef94d46022e1f8883ba7a30dfab849dbe
            test "$(git -C Baseband-guard rev-parse HEAD)" = "cef0daaef94d46022e1f8883ba7a30dfab849dbe"
          else
            curl -LSs https://raw.githubusercontent.com/vc-teahouse/Baseband-guard/main/setup.sh | bash
          fi
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' ./security/Kconfig
          
      # 配置信息，带*为附加项目，具有一定危险性和不确定性
      - name: Add Configuration Settings
        run: |
          cd kernel_workspace/kernel_platform/common
          CONFIG_FILE=./arch/arm64/configs/gki_defconfig
          KERNEL_VERSION="${{ env.KERNEL_VERSION }}"
          
          # 满血 SuSFS 配置清单：后续同时写入 gki_defconfig、厂商 defconfig 和 out/.config
          cat <<'EOF' > susfs_full_configs
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SPOOF_FILE=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF
          sed -i 's/^[[:space:]]*//' susfs_full_configs
          
          set_config() {
            local val="$1"
            local file="${2:-$CONFIG_FILE}"
            local key="${val%%=*}"
            if [ ! -f "$file" ]; then
              echo "⚠️ 配置文件不存在，跳过: $file"
              return 0
            fi
            if grep -qF "${key}=" "$file" || grep -qF "# ${key} is not set" "$file"; then
              VAL="$val" awk -v key="$key" '
                $0 == "# " key " is not set" || index($0, key "=") == 1 { print ENVIRON["VAL"]; next }
                { print }
              ' "$file" > "${file}.tmp" && mv "${file}.tmp" "$file" || rm -f "${file}.tmp"
            else
              printf '%s\n' "$val" >> "$file"
            fi
          }
          
          apply_susfs_full_configs() {
            local cfg="$1"
            while IFS= read -r line; do
              [ -n "$line" ] && set_config "$line" "$cfg"
            done < susfs_full_configs
          }
          
          # SukiSU Ultra配置
          set_config "CONFIG_KSU=y"
          
          # KPM配置
          if [ "${{ github.event.inputs.KPM }}" = "KPM" ] || [ "${{ github.event.inputs.KPM }}" = "N/A" ]; then
            set_config "CONFIG_KPM=y"
          fi
          if [ "${{ github.event.inputs.KPM }}" = "KPN" ]; then
            set_config "CONFIG_KPM=n"
          fi
          
          # SUSFS配置：不只写 gki_defconfig，同时覆盖所有厂商 *defconfig
          if [ "${{ github.event.inputs.SUSFS_META }}" != "-1" ]; then
            echo "正在向所有 defconfig 注入满血 SuSFS 配置..."
            find ./arch/arm64/configs -type f -name "*defconfig" -print | while IFS= read -r cfg; do
              apply_susfs_full_configs "$cfg"
            done
          else
            set_config "CONFIG_KSU_SUSFS=n"
          fi
          
          # TMPFS配置*
          set_config "CONFIG_TMPFS_XATTR=y"
          set_config "CONFIG_TMPFS_POSIX_ACL=y"
          
          # BBR & ECN配置*
          if [ "${{ github.event.inputs.CCM }}" = "true" ]; then
            set_config "CONFIG_TCP_CONG_ADVANCED=y"
            set_config "CONFIG_TCP_CONG_BBR=y"
            set_config "CONFIG_NET_SCH_FQ=y"
            set_config "CONFIG_TCP_CONG_BIC=n"
            set_config "CONFIG_TCP_CONG_WESTWOOD=n"
            set_config "CONFIG_TCP_CONG_HTCP=n"
            set_config "CONFIG_IP_ECN=y"
            set_config "CONFIG_TCP_ECN=y"
            set_config "CONFIG_IPV6_ECN=y"
            set_config "CONFIG_IP_NF_TARGET_ECN=y"
          fi
          
          # Re-Kernel配置*
          if [ "${{ github.event.inputs.RE_KERNEL }}" = "true" ]; then
            set_config "CONFIG_REKERNEL=y"
            set_config "CONFIG_REKERNEL_NETWORK=y"
          fi
          
          # ZRAM配置*
          if [[ "${{ github.event.inputs.ZRAM }}" == 1* ]]; then
            set_config "CONFIG_CRYPTO_LZ4HC=y"
            set_config "CONFIG_CRYPTO_LZ4K=y"
            set_config "CONFIG_CRYPTO_LZ4KD=y"
            set_config "CONFIG_CRYPTO_842=y"
            set_config "CONFIG_CRYPTO_LZ4K_OPLUS=y"
            set_config "CONFIG_ZRAM_WRITEBACK=y"
          fi
          
          # LSM配置*
          if [ "${{ github.event.inputs.LSM_BBG }}" = "true" ]; then
            set_config "CONFIG_BBG=y"
          fi
          
          # DROID_SPACES配置*
          if [ "${{ github.event.inputs.DROID_SPACES }}" = "true" ]; then
            set_config "CONFIG_NTSYNC=y"
            set_config "CONFIG_SYSVIPC=y"
            set_config "CONFIG_DEVTMPFS=y"
            set_config "CONFIG_PID_NS=y"
            set_config "CONFIG_IPC_NS=y"
            set_config "CONFIG_NAMESPACES=y"
            set_config "CONFIG_POSIX_MQUEUE=y"
            set_config "CONFIG_NETFILTER_XT_TARGET_REJECT=y"
            set_config "CONFIG_NETFILTER_XT_TARGET_LOG=y"
            set_config "CONFIG_NETFILTER_XT_MATCH_RECENT=y"
          fi
          
          # IPSET & IPv6_NAT配置*
          if [ "${{ github.event.inputs.NETFILTER }}" = "true" ]; then
            if [[ "$KERNEL_VERSION" != "6.12" && "${CPU}" != mt* ]]; then
              set_config "CONFIG_BPF_STREAM_PARSER=y"
            fi
            set_config "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
            set_config "CONFIG_NETFILTER_XT_SET=y"
            set_config "CONFIG_IP_SET=y"
            set_config "CONFIG_IP_SET_MAX=65534"
            set_config "CONFIG_IP_SET_BITMAP_IP=y"
            set_config "CONFIG_IP_SET_BITMAP_IPMAC=y"
            set_config "CONFIG_IP_SET_BITMAP_PORT=y"
            set_config "CONFIG_IP_SET_HASH_IP=y"
            set_config "CONFIG_IP_SET_HASH_IPMARK=y"
            set_config "CONFIG_IP_SET_HASH_IPPORT=y"
            set_config "CONFIG_IP_SET_HASH_IPPORTIP=y"
            set_config "CONFIG_IP_SET_HASH_IPPORTNET=y"
            set_config "CONFIG_IP_SET_HASH_IPMAC=y"
            set_config "CONFIG_IP_SET_HASH_MAC=y"
            set_config "CONFIG_IP_SET_HASH_NETPORTNET=y"
            set_config "CONFIG_IP_SET_HASH_NET=y"
            set_config "CONFIG_IP_SET_HASH_NETNET=y"
            set_config "CONFIG_IP_SET_HASH_NETPORT=y"
            set_config "CONFIG_IP_SET_HASH_NETIFACE=y"
            set_config "CONFIG_IP_SET_LIST_SET=y"
            set_config "CONFIG_IP6_NF_NAT=y"
            set_config "CONFIG_IP6_NF_TARGET_MASQUERADE=y"
          fi
          
          # 构建依赖项调整及优化
          if [[ "$ENABLE_RUST" == "true" ]]; then
            set_config "CONFIG_RUST=y"
            set_config "CONFIG_ANDROID_BINDER_IPC_RUST=m"
          fi
      - name: Fix IPv6_NAT Error
        if: ${{ github.event.inputs.NETFILTER == 'true' }}
        run: |
          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches"
          cd kernel_workspace/kernel_platform/common
          if [[ "${CPU}" == sm* ]]; then
            echo "修复启用IPv6 NAT后可能出现的设备误报…"
            patch -p1 -F 3 < "${PATCH_DIR}/IPv6_NAT_FIX.patch"
          else
            echo "你的设备不支持 IPv6 NAT，跳过此步骤。"
          fi
          
      # Custom kernel build time, without adding #1 SMP PREEMPT 自定义内核构建时间，不要加入#1 SMP PREEMPT
      - name: Custom BUILD_TIME
        if: ${{ github.event.inputs.BUILD_TIME != '-1' }}
        shell: bash
        run: |
          INPUT_TIME="${{ github.event.inputs.BUILD_TIME }}"
          if [[ -n "$INPUT_TIME" && "$INPUT_TIME" != "F" ]]; then
            DATESTR="$INPUT_TIME"
            echo "Using input BUILD_TIME: $DATESTR"
          else
            DATESTR="$(TZ='UTC' date +'%a %b %d %T %Z %Y')"
            echo "Using UTC time as fallback: $DATESTR"
          fi
          echo "KBUILD_BUILD_TIMESTAMP=${DATESTR}" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"
          cd kernel_workspace/kernel_platform/
          for f in ./common/scripts/mkcompile_h ./"$KERNEL_REPOS"/scripts/mkcompile_h; do
            if [ -f "$f" ]; then
              echo "Patching mkcompile_h with BUILD_TIME=$DATESTR"
              if grep -q 'UTS_VERSION=' "$f"; then
                perl -pi -e "s{UTS_VERSION=\"\\\$\\(.*?\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
              else
                perl -0777 -pi -e "s{cat <<EOF}{cat <<EOF\n#undef UTS_VERSION\n#define UTS_VERSION \"#1 SMP PREEMPT $DATESTR\" } unless /UTS_VERSION/" "$f"
              fi
            fi
          done
          
      - name: Disable GPUEB
        if: ${{ env.KERNEL_VERSION == '5.10' && startsWith(env.CPU, 'mt') }}
        run: |
          echo "Disabling GPUEB for MTK kernel 5.10"
          sed -i '/obj-y.*gpueb/d' kernel_workspace/kernel-5.10/drivers/gpu/mediatek/Makefile
          
      - name: Build Kernel FAST
        if: ${{ github.event.inputs.FAST_BUILD == 'true' }}
        id: fast_build
        run: |
          KERNEL_VERSION="${{ env.KERNEL_VERSION }}"
          cd kernel_workspace/kernel_platform
          
          # 自动检测 LLVM_IAS
          if [[ -f ./common/build.config.arm ]] && grep -q '^LLVM_IAS=1' ./common/build.config.arm; then
            USE_LLVM_IAS=true
          else
            USE_LLVM_IAS=false
          fi
          
          # 强制递推路径
          CLANG_PREBUILT_NAME=$(find "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform" -maxdepth 1 -type d -name 'prebuilts*' -exec test -d '{}/clang/host/linux-x86' \; -print | head -1)
          CLANG_PREBUILT_NAME=$(basename "${CLANG_PREBUILT_NAME:-}")
          echo "✅ CLANG_PREBUILT_NAME=$CLANG_PREBUILT_NAME"
          
          KERNEL_BUILD_TOOLS_PREBUILT_NAME=$(find "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform" -maxdepth 1 -type d -name 'prebuilts*' -exec test -d '{}/kernel-build-tools' \; -print | head -1)
          KERNEL_BUILD_TOOLS_PREBUILT_NAME=$(basename "${KERNEL_BUILD_TOOLS_PREBUILT_NAME:-}")
          echo "✅ KERNEL_BUILD_TOOLS_PREBUILT_NAME=$KERNEL_BUILD_TOOLS_PREBUILT_NAME"
          
          if [[ "$ENABLE_RUST" == "true" ]]; then
            RUST_TOOLS_PREBUILT_NAME=$(find "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform" -maxdepth 1 -type d -name 'prebuilts*' -exec test -d '{}/rust' \; -print | head -1)
            RUST_TOOLS_PREBUILT_NAME=$(basename "${RUST_TOOLS_PREBUILT_NAME:-}")
            echo "✅ RUST_TOOLS_PREBUILT_NAME=$RUST_TOOLS_PREBUILT_NAME"
          fi
          
          # 从 build.config.common 读取 CLANG_PREBUILT_BIN，或者用递推路径 fallback
          CLANG_PREBUILT_BIN=""
          if [[ -f ./common/build.config.common ]]; then
            CLANG_PREBUILT_BIN=$(grep '^CLANG_PREBUILT_BIN=' ./common/build.config.common | cut -d'=' -f2-)
          fi
          
          if [[ -z "$CLANG_PREBUILT_BIN" ]]; then
            CLANG_PREBUILT_BIN="${CLANG_PREBUILT_NAME}/clang/host/linux-x86/clang-zakozako/bin"
          fi
          
          # 优先尝试从 CLANG_PREBUILT_BIN 识别出 clang-r，再去掉 clang-，作为 CLANG_VERSION
          if [[ "$CLANG_PREBUILT_BIN" =~ clang-(r[0-9a-z]+) ]]; then
            CLANG_VERSION="${BASH_REMATCH[1]}"
          else
            # 如果未匹配到，尝试从 build.config.constants 提取
            if [[ -f ./common/build.config.constants ]]; then
              CLANG_VERSION=$(grep '^CLANG_VERSION=' ./common/build.config.constants | cut -d'=' -f2 || true)
            fi
          fi
          
          if [[ -z "$CLANG_VERSION" ]]; then
            echo "⚠️ 未能从 CLANG_PREBUILT_BIN 或 build.config.constants 获取到 Clang 版本，回退至官方构建脚本"
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            echo "请考虑关闭 FAST_BUILD 并提交问题"
            exit 0
          fi
          
          CLANG_PREBUILT_BIN="${CLANG_PREBUILT_BIN/\$\{CLANG_VERSION\}/$CLANG_VERSION}"
          CLANG_PREBUILT_BIN="${CLANG_PREBUILT_BIN/clang-zakozako/clang-${CLANG_VERSION}}"
          
          echo "✅ CLANG_PREBUILT_BIN=$CLANG_PREBUILT_BIN"
          echo "✅ CLANG_VERSION=$CLANG_VERSION"
          echo "✅ USE_LLVM_IAS=$USE_LLVM_IAS"
          
          set +u
          source "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/build/kernel/_setup_env.sh" 2>/dev/null || true
          set -u
          
          export PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$CLANG_PREBUILT_BIN:$PATH"
          CLANG_LIB_PATH="${CLANG_PREBUILT_BIN%/bin}"
          if [[ -d "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$CLANG_LIB_PATH/lib" ]]; then
            export LIBCLANG_PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$CLANG_LIB_PATH/lib"
          elif [[ -d "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/clang-${CLANG_VERSION}/lib" ]]; then
            export LIBCLANG_PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/clang-${CLANG_VERSION}/lib"
          else
            export LIBCLANG_PATH="$(clang --print-resource-dir 2>/dev/null | sed 's|/lib/clang/.*||')/lib" 
            echo "⚠️ LIBCLANG_PATH fallback to system: $LIBCLANG_PATH"
          fi
          echo "✅ LIBCLANG_PATH=$LIBCLANG_PATH"
          export PATH="/usr/lib/ccache:$PATH"
          
          # BINDGEN 检测与 fallback
          if [[ "$ENABLE_RUST" == "true" ]]; then
            BINDGEN_BIN="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$CLANG_PREBUILT_NAME/clang-tools/linux-x86/bin/bindgen"
            if [ -x "$BINDGEN_BIN" ]; then
              export BINDGEN="$BINDGEN_BIN"
              echo "✅ bindgen exists: $BINDGEN_BIN"
            else
              echo "⚠️ prebuilts bindgen 未找到，fallback 到 cargo 安装 bindgen 0.69.5"
              echo "::group::Install bindgen via cargo"
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
              source "$HOME/.cargo/env"
              cargo install bindgen-cli --version 0.69.5
              echo "::endgroup::"
              BINDGEN_BIN=$(which bindgen)
              export BINDGEN="$BINDGEN_BIN"
              echo "✅ BINDGEN_BIN (cargo): $BINDGEN_BIN"
            fi
          fi
          
          # PAHOLE 检测与 fallback
          PAHOLE_BIN="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$KERNEL_BUILD_TOOLS_PREBUILT_NAME/kernel-build-tools/linux-x86/bin/pahole"
          if [ ! -x "$PAHOLE_BIN" ]; then
            PAHOLE_BIN="$(which pahole 2>/dev/null)"
            [ -x "$PAHOLE_BIN" ] && echo "⚠️ pahole fallback to PATH: $PAHOLE_BIN"
          fi
          if [ -x "$PAHOLE_BIN" ]; then
            echo "✅ pahole exists: $PAHOLE_BIN"
          else
            echo "❌ pahole 完全缺失，终止构建"
            exit 13
          fi
          
          # RUSTC 检测与 fallback
          if [[ "$ENABLE_RUST" == "true" ]]; then
            RUSTC_BIN="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$RUST_TOOLS_PREBUILT_NAME/rust/linux-x86/$RUSTC_VERSION/bin/rustc"
            if [ ! -x "$RUSTC_BIN" ]; then
              RUSTC_BIN="$(which rustc 2>/dev/null)"
              [ -x "$RUSTC_BIN" ] && echo "⚠️ rustc fallback to PATH: $RUSTC_BIN"
            fi
            if [ -x "$RUSTC_BIN" ]; then
              echo "✅ rustc exists: $RUSTC_BIN"
              export RUSTC="$RUSTC_BIN"
            else
              echo "❌ rustc 完全缺失且 ENABLE_RUST=true，终止构建"
              exit 13
            fi
          fi
          
          LD_WRAPPER=""
          if [ "${{ github.event.inputs.BUILD_NOCACHE }}" = "false" ] && [[ "$KERNEL_VERSION" == 5.* ]]; then
            LDCACHE_DIR="${GITHUB_WORKSPACE}/kernel_workspace/.thinlto-cache"
            mkdir -p "$LDCACHE_DIR"
            LD_WRAPPER="${GITHUB_WORKSPACE}/kernel_workspace/ld-wrapper"
            LLD_BIN="$(command -v ld.lld)"
            if [[ -z "$LLD_BIN" ]]; then
              echo "⚠️ ld.lld 未找到，无法创建 ld-wrapper"
            fi
            printf '#!/bin/bash\nexec "%s" "$@" --thinlto-cache-dir="%s" --thinlto-cache-policy=cache_size_bytes=3g --thinlto-jobs=%s\n' "$LLD_BIN" "$LDCACHE_DIR" "$(nproc --all)" > "$LD_WRAPPER"
            chmod +x "$LD_WRAPPER"
            echo "✅ ld-wrapper 已创建: $LD_WRAPPER (lld=$LLD_BIN, cache=$LDCACHE_DIR)"
          fi
          
          REAL_CLANG_BIN="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$CLANG_PREBUILT_BIN/clang"
          CC_WRAPPER="$GITHUB_WORKSPACE/kernel_workspace/cc-wrapper"
          printf '#!/bin/bash\nexec ccache "%s" "$@"\n' "$REAL_CLANG_BIN" > "$CC_WRAPPER"
          chmod +x "$CC_WRAPPER"
          echo "✅ cc-wrapper 已创建: $CC_WRAPPER (clang=$REAL_CLANG_BIN)"
          
          cd ./common
          
          # 重映射物理路径
          COMMON_REAL_PATH=$(pwd -P)
          PLATFORM_REAL_PATH=$(dirname "$COMMON_REAL_PATH")
          ROOT_REAL_PATH=$(dirname "$PLATFORM_REAL_PATH")
          MAP="-fdebug-prefix-map=$ROOT_REAL_PATH=."
          MPMAP="-fmacro-prefix-map=$ROOT_REAL_PATH=."
          FPMAP="-ffile-prefix-map=$ROOT_REAL_PATH=."
          
          # KCFLAGS
          KCFLAGS="$MAP $FPMAP -no-canonical-prefixes -O2 -pipe -Wno-error -fno-stack-protector -D__ANDROID_COMMON_KERNEL__"
          KCPPFLAGS="$MPMAP"
          
          MAKE_ARGS=(
            LLVM=1
            ARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu-
            CC="$CC_WRAPPER"
            HOSTCC="$CC_WRAPPER"
            HOSTLD=ld.lld
            PAHOLE="$PAHOLE_BIN"
            KCFLAGS="$KCFLAGS"
            KCPPFLAGS="$KCPPFLAGS"
          )
          
          if [[ -n "$LD_WRAPPER" ]]; then
            MAKE_ARGS+=(LD="$LD_WRAPPER")
          else
            MAKE_ARGS+=(LD=ld.lld)     
          fi
          if [[ "$USE_LLVM_IAS" == "true" ]]; then
            MAKE_ARGS+=(LLVM_IAS=1)
          fi
          if [[ "$ENABLE_RUST" == "true" ]]; then
            MAKE_ARGS+=(RUSTC="$RUSTC_BIN")
            MAKE_ARGS+=(BINDGEN="$BINDGEN_BIN")
          fi
          
          make O=out "${MAKE_ARGS[@]}" gki_defconfig --no-print-directory
          
          sync_susfs_out_config() {
            if [ "${{ github.event.inputs.SUSFS_META }}" != "-1" ] && [ -f susfs_full_configs ]; then
              echo "强制同步满血 SuSFS 配置到 out/.config..."
              while IFS= read -r line; do
                [ -n "$line" ] || continue
                opt="${line%%=*}"
                opt="${opt#CONFIG_}"
                ./scripts/config --file out/.config -e "$opt"
              done < susfs_full_configs
            fi
          }
          sync_susfs_out_config
          
          if [[ "$KERNEL_VERSION" == 5.* ]]; then
            echo "# 设置 LTO = thin"
            scripts/config --file out/.config -e LTO_CLANG
            scripts/config --file out/.config -e LTO_CLANG_THIN
            scripts/config --file out/.config -d LTO_CLANG_NONE
            scripts/config --file out/.config -d LTO_CLANG_FULL
          fi
          
          make O=out "${MAKE_ARGS[@]}" olddefconfig --no-print-directory
          sync_susfs_out_config
          make -j"$(nproc --all)" O=out "${MAKE_ARGS[@]}"
          ccache -s
          
      - name: Fallback to Build Kernel
        if: ${{ github.event.inputs.FAST_BUILD == 'false' || steps.fast_build.outputs.fallback == 'true' }}
        run: |
          cd kernel_workspace
          if [ -f ./kernel_platform/build_with_bazel.py ]; then
            ./kernel_platform/oplus/bazel/oplus_modules_variant.sh ${{ env.CPUD }} ${{ env.BUILD_METHOD }}
            ./kernel_platform/build_with_bazel.py -t ${{ env.CPUD }} ${{ env.BUILD_METHOD }}
          else
            LTO=thin SYSTEM_DLKM_RE_SIGN=0 BUILD_SYSTEM_DLKM=0 KMI_SYMBOL_LIST_STRICT_MODE=0 \
            ./kernel_platform/oplus/build/oplus_build_kernel.sh ${{ env.CPUD }} ${{ env.BUILD_METHOD }}
          fi

      - name: Build vm_bridge_01 against completed kernel
        if: ${{ env.VM_BRIDGE_BUILD == 'true' }}
        shell: bash
        run: |
          # CTF|认证
          set -euo pipefail
          PLATFORM="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"
          COMMON="$PLATFORM/common"
          if [[ -s "$COMMON/out/.config" ]]; then
            OUT="$COMMON/out"
          elif [[ -s "$PLATFORM/out/.config" ]]; then
            OUT="$PLATFORM/out"
          else
            echo "完整内核输出树中没有 .config: $COMMON/out 或 $PLATFORM/out" >&2
            exit 1
          fi
          EVIDENCE="$GITHUB_WORKSPACE/vm_bridge_evidence"
          KERNEL_SRC="$COMMON" \
          KERNEL_OUT="$OUT" \
          EVIDENCE_DIR="$EVIDENCE" \
          TARGET_RELEASE="$VM_BRIDGE_TARGET_RELEASE" \
          TARGET_CLANG_VERSION="$VM_BRIDGE_TARGET_CLANG" \
          REFERENCE_CONFIG_SHA256="$VM_BRIDGE_TARGET_CONFIG_SHA256" \
            bash "$GITHUB_WORKSPACE/vm_bridge_source/scripts/build_against_existing_output.sh"

          (cd "$GITHUB_WORKSPACE/kernel_workspace" && repo manifest -r) > "$EVIDENCE/repo-manifest.txt"
          {
            printf 'common=%s\n' "$(git -C "$PLATFORM/common" rev-parse HEAD)"
            printf 'msm_kernel=%s\n' "$(git -C "$PLATFORM/msm-kernel" rev-parse HEAD)"
            printf 'modules_and_devicetree=%s\n' "$(git -C "$GITHUB_WORKSPACE/kernel_workspace" rev-parse HEAD)"
          } > "$EVIDENCE/kernel_source_commits.txt"
          IMAGE="$(find "$OUT" -type f -name Image -print -quit 2>/dev/null || true)"
          if [[ -n "$IMAGE" && -s "$IMAGE" ]]; then
            sha256sum "$IMAGE" > "$EVIDENCE/kernel_Image.sha256"
          fi
          {
            printf 'action_build_commit=%s\n' "$GITHUB_SHA"
            printf 'vm_bridge_repository=%s\n' "$VM_BRIDGE_REPOSITORY"
            printf 'vm_bridge_ref=%s\n' "$VM_BRIDGE_REF"
            SUSFS_SOURCE_COMMIT="$(git -C "$GITHUB_WORKSPACE" show HEAD:kernel_patches/SOURCE_COMMIT 2>/dev/null | tr -d '[:space:]' || true)"
            printf 'susfs_source_commit=%s\n' "${SUSFS_SOURCE_COMMIT:-unknown}"
          } >> "$EVIDENCE/build_metadata.txt"
          find "$EVIDENCE" -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | xargs -0 sha256sum > "$EVIDENCE/SHA256SUMS"
          echo "VM_BRIDGE_EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"

      - name: Make AnyKernel3
        run: |
          git clone https://github.com/Numbersf/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          mkdir -p kernel_workspace/kernel_platform/out/Final-Image-Find/
          image_path=""
          if [ -d "./kernel_workspace/kernel_platform/common/out/" ]; then
            image_path=$(find "./kernel_workspace/kernel_platform/common/out/" -name "Image" | head -n 1)
            if [ -n "$image_path" ]; then
              echo "✅ 使用 make 编译的统一路径，成功找到 Image 文件"
            fi
          fi
          if [ -z "$image_path" ] && [ -d "./kernel_workspace/kernel_platform/out/" ]; then
            image_path=$(find "./kernel_workspace/kernel_platform/out/" -name "Image" | head -n 1)
            if [ -n "$image_path" ]; then
              echo "✅ 使用官方脚本编译，成功找到 Image 文件"
            fi
          fi
          if [ -z "$image_path" ]; then
            echo "❌ 未找到 Image 文件，构建失败" >&2
            exit 1
          fi
          if [ -f "$image_path" ]; then
            echo "✅ Image file finally located at: $image_path"
            cp "$image_path" ./AnyKernel3/Image
            cp "$image_path" kernel_workspace/kernel_platform/out/Final-Image-Find/Image
          fi
          
      - name: Apply KPX and Replace Image
        if: ${{ github.event.inputs.KPM != 'N/A' }}
        run: |
          KPM_DIR="${GITHUB_WORKSPACE}/kernel_workspace/SukiSU_patch/kpm"
          # KPM_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches/kpm"
          KPN_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches/kpn"
          OUT_DIR="${GITHUB_WORKSPACE}/kernel_workspace/kernel_platform/out/Final-Image-Find"
          cd "${OUT_DIR}"
          if [ "${{ github.event.inputs.KPM }}" = "KPM" ]; then
            cp "${KPM_DIR}/patch_linux" .
            chmod +x patch_linux
            ./patch_linux
          else
            cp "${KPN_DIR}/kptools-linux" "${KPN_DIR}/kpimg-linux" .
            chmod +x ./kptools-linux
            ./kptools-linux -p -i ./Image -k ./kpimg-linux -o ./oImage
          fi
          mv -f oImage Image
          cp Image "${GITHUB_WORKSPACE}/AnyKernel3/Image"

      - name: Record final vm_bridge kernel image evidence
        if: ${{ env.VM_BRIDGE_BUILD == 'true' }}
        id: vm_bridge_image
        shell: bash
        run: |
          # CTF|认证
          set -euo pipefail
          EVIDENCE="${VM_BRIDGE_EVIDENCE:-$GITHUB_WORKSPACE/vm_bridge_evidence}"
          FINAL_IMAGE="$GITHUB_WORKSPACE/AnyKernel3/Image"
          test -s "$FINAL_IMAGE"
          FINAL_IMAGE_SHA256="$(sha256sum "$FINAL_IMAGE" | awk '{print $1}')"
          sha256sum "$FINAL_IMAGE" > "$EVIDENCE/final_kernel_Image.sha256"
          if [[ -z "$VM_BRIDGE_REFERENCE_IMAGE_SHA256" || "$FINAL_IMAGE_SHA256" == "$VM_BRIDGE_REFERENCE_IMAGE_SHA256" ]]; then
            echo "image_match=true" >> "$GITHUB_OUTPUT"
          else
            echo "image_match=false" >> "$GITHUB_OUTPUT"
            printf 'reference_image_sha256=%s\nactual_image_sha256=%s\n' \
              "$VM_BRIDGE_REFERENCE_IMAGE_SHA256" "$FINAL_IMAGE_SHA256" \
              > "$EVIDENCE/image_mismatch.txt"
          fi
          find "$EVIDENCE" -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | xargs -0 sha256sum > "$EVIDENCE/SHA256SUMS"

      - name: Upload vm_bridge_01 ABI evidence
        if: ${{ always() && env.VM_BRIDGE_BUILD == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: vm_bridge_01_${{ github.event.inputs.FILE }}_${{ env.KERNEL_VERSION }}
          path: ./vm_bridge_evidence/*
          if-no-files-found: warn
          retention-days: 90

      - name: Validate final vm_bridge kernel image
        if: ${{ env.VM_BRIDGE_BUILD == 'true' && steps.vm_bridge_image.outputs.image_match != 'true' }}
        shell: bash
        run: |
          echo "最终 Image 与当前设备的参考 Image 不一致；证据 artifact 已上传。" >&2
          echo "这表示当前输出包含本次构建的配置/补丁，不阻断同一输出树的 ABI 产物。"

      - name: Setup Android NDK for local SUSFS module
        if: ${{ github.event.inputs.SUSFS_META != '-1' }}
        run: |
          set -euo pipefail
          echo "== Disk before NDK setup =="
          df -h
          
          # 旧的 setup-ndk action 会把 NDK 复制到 /opt/hostedtoolcache，r26d 经常触发 ENOSPC。
          # 这里改为：优先复用 runner 预装 NDK；没有时清理空间并下载到 workspace，不再写 toolcache。
          find_ndk_build() {
            for base in               "${ANDROID_NDK_HOME:-}"               "${ANDROID_NDK_ROOT:-}"               "${NDK_HOME:-}"               "${ANDROID_HOME:-}/ndk"/*               "${ANDROID_SDK_ROOT:-}/ndk"/*               /usr/local/lib/android/sdk/ndk/*               "${RUNNER_TOOL_CACHE:-}/ndk"/*/x64; do
              [ -n "$base" ] || continue
              [ -x "$base/ndk-build" ] && { echo "$base"; return 0; }
            done
            return 1
          }
          
          NDK_DIR="$(find_ndk_build || true)"
          if [ -z "$NDK_DIR" ]; then
            echo "未找到预装 NDK，开始释放 GitHub Runner 空间并下载 android-ndk-r26d 到 workspace"
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc               /usr/local/share/boost /usr/local/share/powershell /usr/share/swift               "${AGENT_TOOLSDIRECTORY:-}"/CodeQL "${RUNNER_TOOL_CACHE:-}"/CodeQL 2>/dev/null || true
            sudo apt-get clean || true
            rm -rf "$HOME/.cache" "$GITHUB_WORKSPACE/.gradle" 2>/dev/null || true
            df -h
          
            mkdir -p "$GITHUB_WORKSPACE/.android-ndk"
            curl -L --retry 5 --retry-delay 5               -o "$GITHUB_WORKSPACE/android-ndk-r26d-linux.zip"               "https://dl.google.com/android/repository/android-ndk-r26d-linux.zip"
            unzip -q "$GITHUB_WORKSPACE/android-ndk-r26d-linux.zip" -d "$GITHUB_WORKSPACE/.android-ndk"
            rm -f "$GITHUB_WORKSPACE/android-ndk-r26d-linux.zip"
            NDK_DIR="$GITHUB_WORKSPACE/.android-ndk/android-ndk-r26d"
          fi
          
          test -x "$NDK_DIR/ndk-build"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "$NDK_DIR" >> "$GITHUB_PATH"
          "$NDK_DIR/ndk-build" -v
          echo "== Disk after NDK setup =="
          df -h
          
      - name: Build Local SUSFS Module with updated ksu_susfs
        if: ${{ github.event.inputs.SUSFS_META != '-1' }}
        run: |
          set -euo pipefail
          SUSFS_DIR="${GITHUB_WORKSPACE}/kernel_workspace/susfs4ksu"
          if [ ! -d "$SUSFS_DIR" ]; then
            echo "::warning title=SUSFS module skipped::未找到 $SUSFS_DIR"
            exit 0
          fi
          
          cd "$SUSFS_DIR"
          if [ ! -f "./ksu_susfs/jni/features/file_spoof.c" ]; then
            echo "::warning title=Old SUSFS userspace::当前 susfs4ksu 源码没有 file_spoof.c，跳过本地模块编译"
            exit 0
          fi
          
          NDK_DIR="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
          if [ -n "$NDK_DIR" ]; then
            export PATH="$NDK_DIR:$PATH"
          fi
          if ! command -v ndk-build >/dev/null 2>&1; then
            FOUND_NDK_BUILD="$(find "$ANDROID_HOME" "$RUNNER_TOOL_CACHE" -type f -name ndk-build 2>/dev/null | head -n 1 || true)"
            if [ -n "$FOUND_NDK_BUILD" ]; then
              export PATH="$(dirname "$FOUND_NDK_BUILD"):$PATH"
            fi
          fi
          command -v ndk-build
          
          chmod +x ./build_ksu_susfs_tool.sh ./build_ksu_module.sh
          ./build_ksu_susfs_tool.sh
          ./build_ksu_module.sh
          
          test -f ./ksu_module_susfs/tools/ksu_susfs_arm64
          strings ./ksu_module_susfs/tools/ksu_susfs_arm64 | grep -q "add_file_spoof"
          strings ./ksu_module_susfs/tools/ksu_susfs_arm64 | grep -q "add_sus_map_uid"
          
          cp -f ./ksu_module_susfs.zip "${GITHUB_WORKSPACE}/AnyKernel3/ksu_module_susfs_FILE_SPOOF.zip"
          # Numbersf/AnyKernel3 原脚本只识别旧固定文件名；保留一个兼容别名，避免刷机时提示 No SUSFS Module found。
          cp -f ./ksu_module_susfs.zip "${GITHUB_WORKSPACE}/AnyKernel3/ksu_module_susfs_1.5.2+_Release.zip"
          
          # 同时补丁 anykernel.sh，让刷机界面优先显示/安装 FILE_SPOOF 新模块。
          AK_SH="${GITHUB_WORKSPACE}/AnyKernel3/anykernel.sh"
          if [ -f "$AK_SH" ] && ! grep -q 'ksu_module_susfs_FILE_SPOOF.zip' "$AK_SH"; then
            python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ['GITHUB_WORKSPACE']) / 'AnyKernel3' / 'anykernel.sh'
          s = p.read_text(encoding='utf-8')
          old = """if [ -f "$AKHOME/ksu_module_susfs_1.5.2+_Release.zip" ]; then
              MODULE_PATH="$AKHOME/ksu_module_susfs_1.5.2+_Release.zip"
              ui_print "  -> Found SUSFS Module (Release)"
          elif [ -f "$AKHOME/ksu_module_susfs_1.5.2+_CI.zip" ]; then"""
          new = """if [ -f "$AKHOME/ksu_module_susfs_FILE_SPOOF.zip" ]; then
              MODULE_PATH="$AKHOME/ksu_module_susfs_FILE_SPOOF.zip"
              ui_print "  -> Found SUSFS Module (FILE_SPOOF)"
          elif [ -f "$AKHOME/ksu_module_susfs_1.5.2+_Release.zip" ]; then
              MODULE_PATH="$AKHOME/ksu_module_susfs_1.5.2+_Release.zip"
              ui_print "  -> Found SUSFS Module (Release/compat)"
          elif [ -f "$AKHOME/ksu_module_susfs_1.5.2+_CI.zip" ]; then"""
          if old not in s:
              raise SystemExit('AnyKernel3 SUSFS detection block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          fi

          ls -lh "${GITHUB_WORKSPACE}/AnyKernel3"/ksu_module_susfs*.zip
          echo "✅ 已打包新版 SUSFS 模块: AnyKernel3/ksu_module_susfs_FILE_SPOOF.zip"

      - name: Download Latest SUSFS Module from CI
        if: ${{ github.event.inputs.SUSFS_CI == 'CI' && github.event.inputs.SUSFS_META != '-1' }}
        continue-on-error: true
        run: |
          if [ -f ./AnyKernel3/ksu_module_susfs_FILE_SPOOF.zip ]; then
            echo "检测到本地新版 SUSFS 模块，跳过旧 CI 模块下载"
            exit 0
          fi
          LATEST_RUN_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs?status=success" | \
            jq -r '.workflow_runs[] | select(.head_branch == "v1.5.2+") | .id' | head -n 1)
          if [ -z "$LATEST_RUN_ID" ]; then
            echo "No successful run found for branch v1.5.2+"
          else
            ARTIFACT_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs/$LATEST_RUN_ID/artifacts" | jq -r '.artifacts[0].archive_download_url')
            if [ -n "$ARTIFACT_URL" ]; then
              curl -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o ksu_module_susfs_1.5.2+_CI.zip "$ARTIFACT_URL"
              cp ksu_module_susfs_1.5.2+_CI.zip ./AnyKernel3/
            else
              echo "Failed to fetch artifact URL"
            fi
          fi

      - name: Download Latest SUSFS Module from Release
        if: ${{ github.event.inputs.SUSFS_CI == 'Release' && github.event.inputs.SUSFS_META != '-1' }}
        continue-on-error: true
        run: |
          if [ -f ./AnyKernel3/ksu_module_susfs_FILE_SPOOF.zip ]; then
            echo "检测到本地新版 SUSFS 模块，跳过旧 Release 模块下载"
            exit 0
          fi
          wget -O ksu_module_susfs_1.5.2+_Release.zip https://github.com/sidex15/ksu_module_susfs/releases/latest/download/ksu_module_susfs_1.5.2+.zip
          cp ksu_module_susfs_1.5.2+_Release.zip ./AnyKernel3/

      - name: Download Latest SukiSU-Ultra APK from CI
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MANAGER_BRANCH="${{ steps.manager.outputs.manager_branch }}"
          MANAGER_ARTIFACT="${{ steps.manager.outputs.manager_artifact }}"

          echo "Using branch: $MANAGER_BRANCH"
          echo "Downloading artifact: $MANAGER_ARTIFACT"

          run_id=$(gh api "repos/SukiSU-Ultra/SukiSU-Ultra/actions/workflows/build-manager.yml/runs?branch=$MANAGER_BRANCH&status=success&per_page=1" --jq '.workflow_runs[0].id' || echo "")

          if [[ -z "$run_id" ]]; then
            echo "No successful workflow run found on branch $MANAGER_BRANCH. Skipping download."
            exit 0
          fi
          artifact_url=$(gh api "repos/SukiSU-Ultra/SukiSU-Ultra/actions/runs/$run_id/artifacts" | jq -r ".artifacts[] | select(.name == \"$MANAGER_ARTIFACT\") | .archive_download_url" | head -n1)

          if [[ -z "$artifact_url" ]]; then
            echo "No artifact '$MANAGER_ARTIFACT' found in run $run_id. Skipping download."
            exit 0
          fi
          echo "Downloading from: $artifact_url"
          curl -fL -H "Authorization: token $GITHUB_TOKEN" -o "${MANAGER_ARTIFACT}.zip" "$artifact_url"
          unzip -j "${MANAGER_ARTIFACT}.zip" "*.apk" -d ./AnyKernel3/

      - name: Set zip Suffix
        id: suffix
        run: |
          echo "value=${{ env.ZRAM_ALGO_U && format('_{0}', env.ZRAM_ALGO_U) || '' }}${{ github.event.inputs.KPM == 'KPM' && '_KPM' || github.event.inputs.KPM == 'KPN' && '_KPN' || '' }}${{ github.event.inputs.LSM_BBG == 'true' && '_BBG' || '' }}_ILH${{ github.event.inputs.SCHED_HMBIRD== 'true' && '_HMBIRD' || '' }}${{ github.event.inputs.DROID_SPACES== 'true' && '_DS' || '' }}${{ github.event.inputs.RE_KERNEL == 'true' && '_REKER' || '' }}${{ github.event.inputs.LZ4_UPDATE == 'true' && '_LZ4UPD' || '' }}" >> $GITHUB_OUTPUT

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v7
        with:
          name: AnyKernel3_SukiSUUltra_${{ env.KSUVER }}_${{ steps.extract_info.outputs.value }}(${{ env.TKERNEL_VERSION }})${{ steps.suffix.outputs.value }}
          path: ./AnyKernel3/*

      - name: Extract and Process ZRAM Module
        if: startsWith(github.event.inputs.ZRAM, '1/')
        id: zram_find
        run: |
          set -e
          ZRAM_ZIP="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/ZRAM.zip"

          if [ ! -f "$ZRAM_ZIP" ]; then
            echo "❌ 未找到 ZRAM.zip: $ZRAM_ZIP"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          unzip "$ZRAM_ZIP" -d ZRAM-Module

          CONFIG_PROP="ZRAM-Module/config.prop"
          if [ -f "$CONFIG_PROP" ]; then
            echo "修改 config.prop"
            sed -i "s/^ZRAM_ALGO=.*/ZRAM_ALGO=${ZRAM_ALGO}/" "$CONFIG_PROP"
            sed -i "s/^ZRAM_SIZE=.*/ZRAM_SIZE=${ZRAM_SIZE}/" "$CONFIG_PROP"
            echo "ZRAM_ALGO=${ZRAM_ALGO}"
            echo "ZRAM_SIZE=${ZRAM_SIZE}"
          else
            echo "❌ 未找到 config.prop"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          target="./ZRAM-Module/zram/zram.ko"
          echo "查找 zram.ko 模块文件..."
          search_paths=(
            "./kernel_workspace/kernel_platform/out"
            "./kernel_workspace/device/qcom"
          )
          zram_path=""
          for path in "${search_paths[@]}"; do
            if [ -d "$path" ]; then
              zram_path=$(find "$path" -type f -name "zram.ko" | head -n 1)
              [ -n "$zram_path" ] && break
            fi
          done
          if [ -z "$zram_path" ]; then
            zram_path=$(find "./kernel_workspace" -type f -name "zram.ko" | head -n 1)
          fi
          if [ -n "$zram_path" ] && [ -f "$zram_path" ]; then
            echo "✅ zram.ko file finally located at: $zram_path"
            install -D "$zram_path" "$target"
          else
            echo "❌ 未找到 zram.ko 文件，可能是未支持的内核版本或构建失败"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Upload ZRAM Module
        if: startsWith(github.event.inputs.ZRAM, '1/') && steps.zram_find.outputs.upload != 'false'
        uses: actions/upload-artifact@v7
        with:
          name: ZRAM-Module_${{ env.KERNEL_VERSION }}_${{ steps.extract_info.outputs.value }}
          path: ZRAM-Module/*

      - name: Check Cache Size Before Save
        if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' }}
        id: cache_size_check
        run: |
          check_size() {
            local CACHE_DIR="$1"
            local CACHE_NAME="$2"
            if [[ ! -d "$CACHE_DIR" ]]; then
              echo "${CACHE_NAME}_save=false" >> "$GITHUB_OUTPUT"
              return
            fi
            SIZE_MB=$(du -sm "$CACHE_DIR" | cut -f1)
            echo "$CACHE_DIR 大小: ${SIZE_MB}MB"
            if (( SIZE_MB >= 5 )); then
              echo "${CACHE_NAME}_save=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning title=Cache Warning::$CACHE_NAME 小于 5MB，跳过保存"
              echo "${CACHE_NAME}_save=false" >> "$GITHUB_OUTPUT"
            fi
          }
          check_size "${{ env.CCACHE_DIR }}" "ccache"
          check_size "${{ github.workspace }}/kernel_workspace/.thinlto-cache" "thinlto"

      - name: Save Ccache
        if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' && steps.cache_size_check.outputs.ccache_save == 'true' && steps.restore-ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.event.inputs.FILE }}-${{ env.BUILD_METHOD }}-${{ github.event.inputs.FAST_BUILD == 'true' && 'alpha' || 'beta' }}-16.8

      - name: Save ThinLTO Cache
        if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' && github.event.inputs.FAST_BUILD == 'true' && steps.cache_size_check.outputs.thinlto_save == 'true' && steps.restore-thinlto.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/kernel_workspace/.thinlto-cache
          key: thinlto-${{ runner.os }}-${{ github.ref_name }}-${{ github.event.inputs.FILE }}-16.8

      - name: Post-build Disk Check
        run: df -h

